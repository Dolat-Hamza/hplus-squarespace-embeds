<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
.hplus-legal{--blue:#007EC6;--navy:#06324C;--text:#24272A;--muted:#71777C;--line:#DCE2E6;--wash:#F6F8F9;font-family:'Inter',sans-serif;color:var(--text);background:var(--wash);padding:clamp(24px,5vw,64px) 16px;line-height:1.65}
.hplus-legal *{box-sizing:border-box}
.hplus-legal__card{max-width:880px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:clamp(24px,5vw,52px);box-shadow:0 20px 50px -32px rgba(6,50,76,.45)}
.hplus-legal__eyebrow{color:var(--blue);font-weight:700;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase}
.hplus-legal__note{margin-top:32px;padding:14px 16px;border-radius:12px;background:#E6F3FB;color:#0567A1;font-size:.9rem}
.hplus-legal h1,.hplus-legal h2,.hplus-legal h3{font-family:'Poppins',sans-serif;color:var(--navy)}
.hplus-legal h1{font-size:clamp(1.7rem,4vw,2.6rem);line-height:1.2;margin:10px 0 16px}
.hplus-legal h2{font-size:1.15rem;margin:30px 0 8px}
.hplus-legal h3{font-size:1rem;margin:20px 0 6px}
.hplus-legal p,.hplus-legal li{margin:0 0 12px}
.hplus-legal ul{padding-left:20px}
.hplus-legal table{width:100%;border-collapse:collapse;margin:14px 0;font-size:.88rem}
.hplus-legal th,.hplus-legal td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.hplus-legal th{background:var(--wash)}
.hplus-legal a{color:var(--blue)}
.langswitch{display:flex;gap:6px;justify-content:flex-end;margin-bottom:6px}
.langswitch button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:5px 13px;font:inherit;font-size:.82rem;cursor:pointer}
.langswitch button.active{background:var(--navy);border-color:var(--navy);color:#fff}
@media(max-width:520px){.hplus-legal{padding:12px}.hplus-legal__card{border-radius:16px;padding:22px 18px}}

.uhp-header{padding-bottom:12px;margin-bottom:14px}
.uhp-header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;position:relative;padding:2px 0 16px;margin:0 0 20px}
.uhp-brand{display:inline-flex;align-items:center;gap:12px;text-decoration:none}
.uhp-brand svg{height:34px;width:58px;color:var(--blue);flex:0 0 auto}
.uhp-brand svg.uhp-logo{height:42px;width:auto;display:block;flex:0 0 auto}
.uhp-brand svg.uhp-logo{height:32px}
.uhp-brand .bt{line-height:1.05}
.uhp-brand .bt b{font-family:var(--font-head),'Poppins',sans-serif;font-weight:700;color:var(--ink-head);font-size:17px;letter-spacing:.01em;display:block}
.uhp-brand .bt small{display:block;font-family:var(--font-body);font-weight:600;color:var(--blue-2);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
.uhp-brand svg{height:28px;width:48px}
.uhp-brand .bt b{font-size:15px}
.uhp-header-right{display:flex;align-items:center;gap:12px}
.acct-btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--blue),var(--blue-3));color:#fff !important;font-family:var(--font-head),inherit;font-size:clamp(11px,.95vw,13.5px);font-weight:600;letter-spacing:.4px;line-height:1;text-transform:uppercase;text-decoration:none !important;padding:13px 20px;border-radius:999px;white-space:nowrap;box-shadow:0 12px 24px -12px rgba(0,126,198,.75);transition:opacity .2s ease,transform .2s ease,box-shadow .2s ease}
.acct-btn{font-size:12px;padding:11px 16px}
.acct-btn:hover{transform:translateY(-1px);box-shadow:0 16px 30px -12px rgba(0,126,198,.8)}
.uhp-avatar{width:42px;height:42px;display:block;object-fit:contain;border-radius:50%;box-shadow:0 4px 12px -6px rgba(6,50,76,.5)}
.uhp-avatar{width:36px;height:36px}
.uhp-footer{margin-top:26px;border-radius:22px;overflow:hidden;position:relative;background:linear-gradient(120deg,#06324C 0%,#064B73 48%,#007EC6 100%);color:#fff;padding:26px 30px;box-shadow:0 18px 44px -24px rgba(6,50,76,.55)}
.uhp-footer{padding:22px 20px;text-align:center}
.uhp-footer-top{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:14px 24px;flex-wrap:wrap}
.uhp-footer-top{justify-content:center}
.uhp-footer-brand svg.uhp-logo{height:34px;width:auto;display:block}
.uhp-footer-brand svg.uhp-logo .hl-word{fill:#fff}
.uhp-footer-brand{display:flex;align-items:center;gap:12px}
.uhp-footer-brand svg{height:30px;width:52px;color:#fff}
.uhp-footer-brand span{font-family:var(--font-head),'Poppins',sans-serif;font-weight:600;font-size:15px}
.uhp-footer-links{display:flex;gap:18px;flex-wrap:wrap}
.uhp-footer-links a{color:#D5E7F2;text-decoration:none;font-family:var(--font-body);font-size:13.5px;font-weight:500;transition:color .15s}
.uhp-footer-links a:hover{color:#fff}
.uhp-footer-links{justify-content:center}
.uhp-footer-bottom{position:relative;z-index:1;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.18);font-family:var(--font-body);font-size:12px;color:#BCDFF5}
.bt{line-height:1.05}
.bt b{font-family:var(--font-head),'Poppins',sans-serif;font-weight:700;color:var(--ink-head);font-size:17px;letter-spacing:.01em;display:block}
.bt small{display:block;font-family:var(--font-body);font-weight:600;color:var(--blue-2);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
.bt b{font-size:15px}

/* variables and layout for the shared header and footer */
:root{
  --blue:#007EC6;--blue-2:#0567A1;--blue-3:#064B73;--ink-head:#06324C;--blue-050:#E6F3FB;
  --ink:#24272A;--muted:#71777C;--hair:#DCE2E6;--grey:#9D9D9C;
  --teal:#0FB5A5;--coral:#FF6A5A;--gold:#F5B83D;--ok:#1EA672;--error:#FF6A5A;
  --page:#F6F8F9;--card:#FFFFFF;
  --font-head:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --radius-card:22px;--radius-btn:999px;
}
.hplus-wrap{max-width:820px;margin:0 auto}
.hplus-wrap{max-width:100%}
.hplus-root{padding:16px 16px 0;font-family:var(--font-body)}

/* align the shared header and footer with the document card */
.hplus-root > .hplus-wrap{max-width:880px;margin:0 auto}

var DOC = {"de": "<h1>AUFTRAGSVERARBEITUNGSVERTRAG (AVV)</h1><p>Dieser Auftragsverarbeitungsvertrag (&bdquo;Vertrag&ldquo;) ist Bestandteil jedes bestehenden oder k&uuml;nftigen Dienstleistungsvertrags (&bdquo;Hauptvertrag&ldquo;) zwischen:</p><p>Healthcare Deutschland GmbH\nBergstra&szlig;e 31, 69469 Weinheim, Germany\n[enter registration number]\n0800 44 020 44; info@united-healthcare.eu\n(&bdquo;Verantwortlicher&ldquo;)</p><p>und seinen Auftragsverarbeitern im nachstehend definierten Sinne.</p><h2>1. BEGRIFFSBESTIMMUNGEN</h2><ul><li>&bdquo;Anwendbares Datenschutzrecht&ldquo; bezeichnet die DSGVO sowie alle sie umsetzenden oder erg&auml;nzenden Vorschriften in den EU-/EWR-Mitgliedstaaten, einschlie&szlig;lich nationaler Regelungen zum Gesundheitsdatenschutz.</li><li>&bdquo;Personenbezogene Daten&ldquo;, &bdquo;Verantwortlicher&ldquo;, &bdquo;Auftragsverarbeiter&ldquo;, &bdquo;betroffene Person&ldquo;, &bdquo;Verarbeitung&ldquo; und &bdquo;Aufsichtsbeh&ouml;rde&ldquo; haben die in der DSGVO festgelegte Bedeutung.</li><li>&bdquo;Unterauftragsverarbeiter&ldquo; bezeichnet jeden Dritten, den der Auftragsverarbeiter mit der Verarbeitung personenbezogener Daten im Auftrag des Verantwortlichen betraut.</li></ul><h2>2. ZWECK DER VERARBEITUNG</h2><p>Der Verantwortliche beauftragt den Auftragsverarbeiter mit der Verarbeitung personenbezogener Daten ausschlie&szlig;lich zu den folgenden festgelegten und rechtm&auml;&szlig;igen Zwecken:\n- Versand medizinischer Erinnerungsbenachrichtigungen an betroffene Personen per E-Mail, SMS, WhatsApp oder Telefonanruf;\n- Vermarktung, Bewerbung und Empfehlung verordneter Arzneimittel, Medizinprodukte oder Dienstleistungen;\n- Durchf&uuml;hrung von Analysen, Segmentierungen, Auswertungen und Kommunikationsma&szlig;nahmen &uuml;ber integrierte Werkzeuge;\n- Vertriebsunterst&uuml;tzung und CRM-Verwaltung;\n- Kundenbetreuung und Kundenbindung.</p><h2>3. LAUFZEIT</h2><p>Dieser Vertrag gilt f&uuml;r die Laufzeit des Hauptvertrags einschlie&szlig;lich etwaiger Verl&auml;ngerungen oder bis der Auftragsverarbeiter keine personenbezogenen Daten mehr im Auftrag des Verantwortlichen verarbeitet.</p><h2>4. KATEGORIEN BETROFFENER PERSONEN &amp; DATENARTEN</h2><p>Betroffene Personen:\n- Patientinnen, Patienten und Interessentinnen und Interessenten;\n- Kundinnen, Kunden und potenzielle Kundinnen und Kunden;\n- Leistungserbringer im Gesundheitswesen (soweit einschl&auml;gig).\n\nVerarbeitete personenbezogene Daten:\n- Identifikationsdaten: Name, Telefonnummer, E-Mail-Adresse, Geburtsdatum, Anschrift;\n- Kommunikationspr&auml;ferenzen, Einwilligungsdaten;\n- Krankengeschichte (soweit f&uuml;r Erinnerungen und Empfehlungen erforderlich);\n- Verordnete oder erworbene Arzneimittel (Historie);\n- Interaktionsdaten (Metadaten zu E-Mail/SMS/Anrufen, &Ouml;ffnungsraten, Reaktionsprotokolle).</p><h2>5. PFLICHTEN DES VERANTWORTLICHEN</h2><ul><li>Festlegung einer Rechtsgrundlage f&uuml;r jede Verarbeitungst&auml;tigkeit (Art. 6 und 9 DSGVO);</li><li>Sicherstellung transparenter Information und Einholung einer informierten Einwilligung, soweit einschl&auml;gig;</li><li>F&uuml;hrung eines ordnungsgem&auml;&szlig;en Verzeichnisses von Verarbeitungst&auml;tigkeiten nach Art. 30 DSGVO;</li><li>Nutzung sicherer Verfahren zur &Uuml;bermittlung personenbezogener Daten an Auftragsverarbeiter;</li><li>Verantwortung f&uuml;r Datenschutzhinweise und Einwilligungsmechanismen.</li></ul><h2>6. PFLICHTEN DES AUFTRAGSVERARBEITERS</h2><p>Verarbeitung nach Weisung des Verantwortlichen:\n- Der Auftragsverarbeiter verarbeitet personenbezogene Daten ausschlie&szlig;lich auf dokumentierte Weisung des Verantwortlichen.\n\nVertraulichkeit:\n- Der Auftragsverarbeiter stellt sicher, dass die zur Verarbeitung befugten Personen zur Vertraulichkeit verpflichtet sind.\n\nTechnische und organisatorische Sicherheitsma&szlig;nahmen:\n- Verschl&uuml;sselung im Ruhezustand und bei der &Uuml;bertragung;\n- Rollenbasierte Zugriffskontrollen;\n- Verfahren zur Erkennung von und Reaktion auf Vorf&auml;lle;\n- Sichere Authentifizierungsverfahren;\n- Regelm&auml;&szlig;ige Tests und Pr&uuml;fungen.\n\nUnterst&uuml;tzung und Zusammenarbeit:\n- Der Auftragsverarbeiter unterst&uuml;tzt den Verantwortlichen bei der Beantwortung von Antr&auml;gen betroffener Personen;\n- bei der Durchf&uuml;hrung von Datenschutz-Folgenabsch&auml;tzungen (DSFA);\n- bei der Erf&uuml;llung der Pflichten nach Art. 32 bis 36 DSGVO.\n\nDokumentation:\n- Der Auftragsverarbeiter f&uuml;hrt ein vollst&auml;ndiges Verzeichnis der Verarbeitungst&auml;tigkeiten nach Art. 30 Abs. 2 DSGVO.</p><h2>7. UNTERAUFTRAGSVERARBEITUNG</h2><p>Genehmigte Unterauftragsverarbeiter:\nDer Verantwortliche genehmigt den Einsatz der folgenden Unterauftragsverarbeiter:</p><table><thead><tr><th>Unterauftragsverarbeiter</th><th>Zweck</th><th>Ort der Daten&uuml;bermittlung</th></tr></thead><tbody><tr><td>HubSpot Inc.</td><td>CRM, Marketing-Automatisierung</td><td>EU</td></tr><tr><td>Microsoft Power BI</td><td>Business Intelligence, Auswertungen</td><td>EU</td></tr><tr><td>AirCall SAS</td><td>SMS- und WhatsApp-Nachrichten sowie Telefonanrufe</td><td>EU</td></tr><tr><td>CData Software, Inc. &ndash; HubSpot Power BI Connector</td><td>HubSpot Power BI Connector f&uuml;r Business Intelligence und Auswertungen.</td><td>USA (&Uuml;bermittlung nach Ma&szlig;gabe von Abschnitt 8)</td></tr><tr><td>Datawarehouse.io LLC &ndash; HubSpot Power BI Connector</td><td>HubSpot Power BI Connector f&uuml;r Business Intelligence und Auswertungen.</td><td>USA (&Uuml;bermittlung nach Ma&szlig;gabe von Abschnitt 8)</td></tr><tr><td>Meta</td><td>WhatsApp- und Social-Media-Marketing</td><td>EU</td></tr><tr><td>Pfalzkom</td><td>Server- und Hosting-Dienste</td><td>EU</td></tr><tr><td>Ring Central</td><td>SMS- und WhatsApp-Nachrichten sowie Telefonanrufe</td><td>EU</td></tr><tr><td>Healthcare Deutschland GmbH</td><td>Kundenservice</td><td>EU</td></tr><tr><td>ISP Services GmbH</td><td>Kundenservice</td><td>EU</td></tr><tr><td>ISP Services GmbH</td><td>Apotheke</td><td>EU</td></tr><tr><td>Apotheke an der Bergstrasse</td><td>Apotheke</td><td></td></tr></tbody></table><p>Pflichten der Unterauftragsverarbeiter:\n- Der Auftragsverarbeiter stellt sicher, dass jeder Unterauftragsverarbeiter einer schriftlichen Vereinbarung unterliegt, die gleichwertige Datenschutzpflichten auferlegt.</p><h2>8. INTERNATIONALE DATEN&Uuml;BERMITTLUNG</h2><p>Soweit personenbezogene Daten au&szlig;erhalb des EWR oder des Vereinigten K&ouml;nigreichs &uuml;bermittelt werden:\n- st&uuml;tzt sich die &Uuml;bermittlung auf die Standardvertragsklauseln der Europ&auml;ischen Kommission (SCC);\n- ergreift der Auftragsverarbeiter erforderlichenfalls erg&auml;nzende Ma&szlig;nahmen, um ein angemessenes Schutzniveau sicherzustellen;\n- stellt der Auftragsverarbeiter auf Anfrage eine Zusammenfassung der Transfer-Folgenabsch&auml;tzung (TIA) bereit.</p><h2>9. MELDUNG VON SICHERHEITSVORF&Auml;LLEN</h2><p>Der Auftragsverarbeiter benachrichtigt den Verantwortlichen unverz&uuml;glich, in jedem Fall jedoch innerhalb von 48 Stunden, nachdem ihm eine Verletzung des Schutzes personenbezogener Daten des Verantwortlichen bekannt geworden ist.</p><h2>10. PR&Uuml;FUNG UND NACHWEIS</h2><p>Auf schriftliche Anfrage stellt der Auftragsverarbeiter alle erforderlichen Informationen zum Nachweis der Einhaltung bereit und erm&ouml;glicht Pr&uuml;fungen (nach angemessener Vorank&uuml;ndigung und unter Wahrung der Vertraulichkeit) einmal j&auml;hrlich oder bei Verdacht auf Versto&szlig; oder Datenschutzverletzung.</p><h2>11. R&Uuml;CKGABE ODER L&Ouml;SCHUNG DER DATEN</h2><p>Bei Beendigung des Hauptvertrags gilt:\n- Der Auftragsverarbeiter gibt nach Wahl des Verantwortlichen alle personenbezogenen Daten zur&uuml;ck oder l&ouml;scht sie sicher;\n- die L&ouml;schung wird auf Anfrage schriftlich best&auml;tigt;\n- eine Aufbewahrung ist nur zul&auml;ssig, soweit dies nach Unionsrecht oder mitgliedstaatlichem Recht erforderlich ist.</p><h2>12. HAFTUNG</h2><p>Jede Partei haftet f&uuml;r Sch&auml;den, die aus ihrer eigenen Verletzung dieses Vertrags oder aus einem Versto&szlig; gegen das anwendbare Datenschutzrecht entstehen.</p><h2>13. ANWENDBARES RECHT UND GERICHTSSTAND</h2><p>Dieser Vertrag unterliegt dem Recht von [enter governing jurisdiction]; ausschlie&szlig;licher Gerichtsstand sind die zust&auml;ndigen Gerichte in [enter jurisdiction].</p><h2>14. KONTAKTANGABEN</h2><p>Kontakt des Verantwortlichen:\nName: Daniel Schaupp &ndash; Data Protection Officer, DeltaMed S&uuml;d\nAnschrift: Untere Gasse 9, 71642 Ludwigsburg, Germany\nE-Mail: daniel.schaupp@deltamedsued.de\nTelefon: 07141 - 974 57 15\n\nDatenschutzkontakt der Auftragsverarbeiter:\nDie Kontaktdaten der einzelnen Unterauftragsverarbeiter sind in Anlage III oder im jeweiligen Auftragsverarbeitungsvertrag auf Anfrage verf&uuml;gbar.</p><h2>15. ANLAGEN</h2><ul><li>Anlage I &ndash; Beschreibung der Verarbeitungst&auml;tigkeiten</li><li>Anlage II &ndash; Technische und organisatorische Ma&szlig;nahmen</li><li>Anlage III &ndash; Liste der Unterauftragsverarbeiter und &Uuml;bermittlungsmechanismen</li></ul><p>ANLAGE I &ndash; Beschreibung der Verarbeitungst&auml;tigkeiten</p><p>Diese Anlage beschreibt Art und Umfang der Verarbeitungst&auml;tigkeiten, die die Auftragsverarbeiter im Auftrag der Healthcare Deutschland GmbH durchf&uuml;hren.\n\n1. Art der Verarbeitung:\n  - Erhebung, Speicherung, Organisation, Einsichtnahme, Nutzung, &Uuml;bermittlung und L&ouml;schung personenbezogener Daten.\n  - Automatisierte und manuelle Verarbeitung &uuml;ber CRM-, Telefonie- und Marketingsysteme.\n\n2. Zweck der Verarbeitung:\n  - Versand medizinischer Erinnerungsbenachrichtigungen per E-Mail, SMS, WhatsApp oder Telefonanruf.\n  - Vermarktung, Empfehlung und Unterst&uuml;tzung des Verkaufs verordneter Arzneimittel und Gesundheitsprodukte.\n  - Kundenbetreuung und Pflege laufender Kundenbeziehungen.\n  - Auswertung von Nutzungsdaten zur Verbesserung gesundheitlicher Ergebnisse und der Marketingwirksamkeit.\n\n3. Arten personenbezogener Daten:\n  - Identifikationsdaten: vollst&auml;ndiger Name, Anschrift, E-Mail-Adresse, Telefonnummer, Geburtsdatum.\n  - Kommunikationsdaten: Nachrichtenprotokolle, Einwilligungsstatus, Interaktionsmetadaten.\n  - Gesundheitsbezogene Daten: Historie verordneter Arzneimittel, Therapiepl&auml;ne (im erforderlichen Mindestumfang und auf Grundlage der Einwilligung).\n  - Technische Daten: IP-Adressen, Browser- und Ger&auml;tedaten (soweit f&uuml;r die Zustellleistung erforderlich).\n\n4. Kategorien betroffener Personen:\n  - Patientinnen, Patienten oder Kundinnen und Kunden, die eingewilligt oder einen Vertrag &uuml;ber gesundheitsbezogene Leistungen oder Produkte geschlossen haben.\n  - Interessentinnen und Interessenten, die Interesse bekundet oder die Leistungen genutzt haben.\n\n5. Dauer der Verarbeitung:\n  - F&uuml;r die Laufzeit des Hauptvertrags oder bis die Daten nicht mehr ben&ouml;tigt werden und nach Weisung des Verantwortlichen gel&ouml;scht wurden.</p><p>ANLAGE II &ndash; Technische und organisatorische Ma&szlig;nahmen</p><p>Diese Anlage beschreibt die technischen und organisatorischen Mindestma&szlig;nahmen, die die Auftragsverarbeiter zur Sicherheit personenbezogener Daten umsetzen.\n\n1. Zugriffskontrolle:\n  - Rollenbasierte Zugriffskontrollen (RBAC) auf Anwendungs- und Infrastrukturebene.\n  - Sichere Authentifizierungsverfahren einschlie&szlig;lich Mehr-Faktor-Authentifizierung (MFA).\n  - Protokollierung und regelm&auml;&szlig;ige &Uuml;berpr&uuml;fung der Zugriffsrechte.\n\n2. Verschl&uuml;sselung:\n  - Verschl&uuml;sselung personenbezogener Daten bei der &Uuml;bertragung mittels TLS 1.2 oder h&ouml;her.\n  - Verschl&uuml;sselung personenbezogener Daten im Ruhezustand mittels AES-256 oder einem vergleichbaren Standard.\n\n3. Integrit&auml;t und Vertraulichkeit:\n  - Speicherung in sicheren Cloud-Umgebungen mit strikter Trennung von nicht zugeh&ouml;rigen Daten.\n  - Logischer Systemzugriff ausschlie&szlig;lich f&uuml;r befugtes Personal unter Geheimhaltungsvereinbarung.\n\n4. Physische Sicherheit:\n  - Die von den Unterauftragsverarbeitern genutzten Rechenzentren erf&uuml;llen anerkannte Sicherheitszertifizierungen (z. B. ISO 27001, SOC 2).\n\n5. Belastbarkeit und Verf&uuml;gbarkeit:\n  - Regelm&auml;&szlig;ige Sicherungen und Notfallwiederherstellungspl&auml;ne.\n  - Auf Hochverf&uuml;gbarkeit und Ausfallsicherheit ausgelegte Systeme.\n\n6. Reaktion auf Vorf&auml;lle:\n  - Formalisierte Verfahren zur Reaktion auf Sicherheitsvorf&auml;lle.\n  - Verletzungen des Schutzes personenbezogener Daten werden dem Verantwortlichen unverz&uuml;glich, in jedem Fall innerhalb von 48 Stunden, gemeldet.\n\n7. Schulung und Sensibilisierung:\n  - Regelm&auml;&szlig;ige Datenschutz- und Sicherheitsschulungen f&uuml;r alle an der Verarbeitung beteiligten Besch&auml;ftigten.\n\n8. &Uuml;berwachung und Tests:\n  - Laufende Schwachstellen-Scans und Penetrationstests.\n  - Regelm&auml;&szlig;ige Sicherheitsaudits durch interne und externe Fachleute.</p><p>ANLAGE III &ndash; Liste der Unterauftragsverarbeiter und &Uuml;bermittlungsmechanismen</p><p>Genehmigte Unterauftragsverarbeiter:\nDer Verantwortliche genehmigt den Einsatz der folgenden Unterauftragsverarbeiter:</p><table><thead><tr><th>Unterauftragsverarbeiter</th><th>Zweck</th><th>Ort der Daten&uuml;bermittlung</th><th>Rechtsgrundlage der &Uuml;bermittlung</th></tr></thead><tbody><tr><td>HubSpot Inc.</td><td>CRM, Marketing-Automatisierung</td><td>EU</td><td>Standardvertragsklauseln (SCC)</td></tr><tr><td>Microsoft Power BI</td><td>Business Intelligence, Auswertungen</td><td>EU</td><td>Standardvertragsklauseln (SCC)</td></tr><tr><td>AirCall SAS</td><td>SMS- und WhatsApp-Nachrichten sowie Telefonanrufe</td><td>EU</td><td>Standardvertragsklauseln (SCC) und erg&auml;nzende Ma&szlig;nahmen</td></tr><tr><td>CData Software, Inc. &ndash; HubSpot Power BI Connector</td><td>HubSpot Power BI Connector f&uuml;r Business Intelligence und Auswertungen.</td><td>USA (&Uuml;bermittlung nach Ma&szlig;gabe von Abschnitt 8)</td><td>Standardvertragsklauseln (SCC) &ndash; siehe Abschnitt 8.</td></tr><tr><td>Datawarehouse.io LLC &ndash; HubSpot Power BI Connector</td><td>HubSpot Power BI Connector f&uuml;r Business Intelligence und Auswertungen.</td><td>USA (&Uuml;bermittlung nach Ma&szlig;gabe von Abschnitt 8)</td><td>Standardvertragsklauseln (SCC) &ndash; siehe Abschnitt 8.</td></tr><tr><td>Meta</td><td>WhatsApp- und Social-Media-Marketing</td><td>EU</td><td>Siehe Abschnitt 8, soweit einschl&auml;gig.</td></tr><tr><td>Pfalzkom</td><td>Server- und Hosting-Dienste</td><td>EU</td><td>Siehe Abschnitt 8, soweit einschl&auml;gig.</td></tr><tr><td>Ring Central</td><td>SMS- und WhatsApp-Nachrichten sowie Telefonanrufe</td><td>EU</td><td>Siehe Abschnitt 8, soweit einschl&auml;gig.</td></tr><tr><td>Healthcare Deutschland GmbH</td><td>Kundenservice</td><td>EU</td><td>Siehe Abschnitt 8, soweit einschl&auml;gig.</td></tr><tr><td>ISP Services GmbH</td><td>Kundenservice</td><td>EU</td><td>Siehe Abschnitt 8, soweit einschl&auml;gig.</td></tr><tr><td>ISP Services GmbH</td><td>Apotheke</td><td>EU</td><td>Siehe Abschnitt 8, soweit einschl&auml;gig.</td></tr><tr><td>Apotheke an der Bergstrasse</td><td>Apotheke</td><td></td><td>Siehe Abschnitt 8, soweit einschl&auml;gig.</td></tr></tbody></table><p>Pflichten der Unterauftragsverarbeiter:\n- Der Auftragsverarbeiter stellt sicher, dass jeder Unterauftragsverarbeiter einer schriftlichen Vereinbarung unterliegt, die gleichwertige Datenschutzpflichten auferlegt.</p>", "en": "<h1>DATA PROCESSING AGREEMENT (DPA)</h1><p>This Data Processing Agreement (&quot;Agreement&quot;) forms part of any existing or future contract for services (&quot;Main Agreement&quot;) between:</p><p>Healthcare Deutschland GmbH\nBergstra\u00dfe 31, 69469 Weinheim, Germany\n[enter registration number]\n0800 44 020 44; info@united-healthcare.eu\n(\u201cController\u201d)</p><p>and its Processors, as defined below.</p><h2>1. DEFINITIONS</h2><ul><li>&quot;Applicable Data Protection Law&quot; means the GDPR, and all laws implementing or supplementing it in any EU/EEA Member State, including national health privacy legislation.</li><li>&quot;Personal Data&quot;, &quot;Controller&quot;, &quot;Processor&quot;, &quot;Data Subject&quot;, &quot;Processing&quot;, and &quot;Supervisory Authority&quot; shall have the meanings given in the GDPR.</li><li>\u201cSub-processor\u201d means any third party engaged by Processor to process Personal Data on behalf of the Controller.</li></ul><h2>2. PURPOSE OF PROCESSING</h2><p>The Controller appoints the Processor to process Personal Data solely for the following specified, lawful purposes:\n- Sending medical reminder notifications to Data Subjects via email, SMS, WhatsApp, or phone calls;\n- Marketing, promoting, and recommending prescribed medications or medical products or services;\n- Performing analytics, segmentation, reporting, and communication activities via integrated tools;\n- Sales enablement and CRM management;\n- Customer support and engagement.</p><h2>3. DURATION</h2><p>This Agreement is effective for the term of the Main Agreement and any renewal periods, or until the Processor no longer processes Personal Data on behalf of the Controller.</p><h2>4. CATEGORIES OF DATA SUBJECTS &amp; TYPES OF DATA</h2><p>Data Subjects:\n- Patients and prospective patients;\n- Customers and prospects;\n- Healthcare providers (where applicable).\n\nPersonal Data Processed:\n- Identifiers: Name, phone number, email, date of birth, address;\n- Communication preferences, consent data;\n- Medical history (to the extent required for reminders and recommendations);\n- Prescribed or purchased medication history;\n- Interaction data (email/SMS/call metadata, open rates, response logs).</p><h2>5. CONTROLLER OBLIGATIONS</h2><ul><li>Establish a lawful basis for each Processing activity (Articles 6 &amp; 9 GDPR);</li><li>Ensure transparent disclosure and obtain informed consent, where applicable;</li><li>Maintain accurate records of Processing under Article 30;</li><li>Use secure methods to transmit Personal Data to Processors;</li><li>Be responsible for privacy notices and user consent mechanisms.</li></ul><h2>6. PROCESSOR OBLIGATIONS</h2><p>Processing on Controller&#x27;s Instructions:\n- Processor will process Personal Data only on documented instructions from the Controller.\n\nConfidentiality:\n- Processor ensures personnel authorised to process the data are bound by confidentiality obligations.\n\nTechnical and Organisational Security Measures:\n- Encryption at rest and in transit;\n- Role-based access controls;\n- Incident detection and response plans;\n- Secure authentication protocols;\n- Regular testing and auditing.\n\nAssistance and Cooperation:\n- Processor shall assist the Controller in responding to Data Subject rights requests;\n- Performing Data Protection Impact Assessments (DPIAs);\n- Complying with Article 32\u201336 obligations.\n\nRecords:\n- Processor shall maintain full records of processing activities per Article 30(2).</p><h2>7. SUB-PROCESSING</h2><p>Authorised Sub-processors:\nThe Controller authorises the use of the following sub-processors:</p><table><thead><tr><th>Sub-Processor</th><th>Purpose</th><th>Data Transfer Location</th></tr></thead><tbody><tr><td>HubSpot Inc.</td><td>CRM, marketing automation</td><td>EU</td></tr><tr><td>Microsoft Power BI</td><td>Business intelligence, reporting</td><td>EU</td></tr><tr><td>AirCall SAS</td><td>SMS Messaging, Whats App Messaging and Phone Calls</td><td>EU</td></tr><tr><td>CData Software, Inc. \u2013 HubSpot Power BI Connector</td><td>HubSpot Power BI Connector for business intelligence and reporting.</td><td>US (transfer subject to section 8)</td></tr><tr><td>Datawarehouse.io LLC \u2013 HubSpot Power BI Connector</td><td>HubSpot Power BI Connector for business intelligence and reporting.</td><td>US (transfer subject to section 8)</td></tr><tr><td>Meta</td><td>WhatsApp and Social Media Marketing</td><td>EU</td></tr><tr><td>Pfalzkom</td><td>Server &amp; hosting services</td><td>EU</td></tr><tr><td>Ring Central</td><td>SMS Messaging, Whats App Messaging and Phone Calls</td><td>EU</td></tr><tr><td>Healthcare Deutschland GmbH</td><td>Customer Service</td><td>EU</td></tr><tr><td>ISP Services GmbH</td><td>Customer Service</td><td>EU</td></tr><tr><td>ISP Services GmbH</td><td>Pharmacy</td><td>EU</td></tr><tr><td>Apotheke an der Bergstrasse</td><td>Pharmacy</td><td></td></tr></tbody></table><p>Sub-Processor Obligations:\n- Processor shall ensure each Sub-processor is subject to a written agreement that imposes equivalent data protection obligations.</p><h2>8. INTERNATIONAL DATA TRANSFERS</h2><p>Where Personal Data is transferred outside the EEA or UK:\n- The transfer shall rely on European Commission Standard Contractual Clauses (SCCs);\n- The Processor shall implement supplementary measures where needed to ensure adequacy;\n- The Processor shall, on request, provide a Transfer Impact Assessment (TIA) summary.</p><h2>9. SECURITY INCIDENT NOTIFICATION</h2><p>Processor shall notify the Controller without undue delay (and in any event within 48 hours) upon becoming aware of a Personal Data Breach affecting the Controller\u2019s Personal Data.</p><h2>10. AUDIT AND COMPLIANCE</h2><p>Upon written request, Processor shall provide all necessary information to demonstrate compliance, and permit audits (subject to reasonable notice and confidentiality) once per year, or in case of suspected non-compliance or breach.</p><h2>11. RETURN OR DELETION OF DATA</h2><p>Upon termination of the Main Agreement:\n- The Processor shall, at the Controller\u2019s discretion, return or securely delete all Personal Data;\n- Deletion will be certified in writing upon request;\n- Data may be retained only if required under EU or Member State law.</p><h2>12. LIABILITY</h2><p>Each party shall remain liable for damages arising from its own breach of this Agreement or violation of Applicable Data Protection Law.</p><h2>13. GOVERNING LAW AND JURISDICTION</h2><p>This Agreement shall be governed by the laws of [enter governing jurisdiction], with exclusive jurisdiction granted to the competent courts of [enter jurisdiction].</p><h2>14. CONTACT INFORMATION</h2><p>Controller Contact:\nName: Daniel Schaupp \u2013 Data Protection Officer, DeltaMed S\u00fcd\nAddress: Untere Gasse 9, 71642 Ludwigsburg, Germany\nEmail: daniel.schaupp@deltamedsued.de\nPhone: 07141 - 974 57 15\n\nProcessor Privacy Contact:\nFor each sub-processor, contact details are available in Annex III or the relevant DPA upon request.</p><h2>15. ANNEXES</h2><ul><li>Annex I \u2013 Description of Processing Activities</li><li>Annex II \u2013 Technical and Organisational Measures</li><li>Annex III \u2013 Sub-Processor List and Data Transfer Mechanisms</li></ul><p>ANNEX I \u2013 Description of Processing Activities</p><p>This Annex outlines the nature and scope of processing activities performed by the Processors on behalf of Healthcare Deutschland GmbH.\n\n1. Nature of Processing:\n  - Collection, storage, organisation, consultation, use, transfer, and deletion of personal data.\n  - Automated and manual processing through CRM, telephony, and marketing systems.\n\n2. Purpose of Processing:\n  - To send medical reminder notifications via email, SMS, WhatsApp, or phone call.\n  - To market, recommend, and facilitate the sale of prescribed medications and healthcare products.\n  - To provide customer support and manage ongoing customer relationships.\n  - To analyse usage data for the purpose of improving health outcomes and marketing effectiveness.\n\n3. Types of Personal Data:\n  - Identification data: full name, address, email, phone number, date of birth.\n  - Communication data: message logs, consent status, interaction metadata.\n  - Health-related data: prescribed medication history, treatment schedules (as minimally required and based on consent).\n  - Technical data: IP addresses, browser/device data (as needed for delivery performance).\n\n4. Categories of Data Subjects:\n  - Patients or customers who have provided consent or entered into a contract for health-related services or products.\n  - Prospective customers who have expressed interest or engaged with the services.\n\n5. Duration of Processing:\n  - For the term of the Main Agreement or until the data is no longer required and has been deleted in accordance with Controller instructions.</p><p>ANNEX II \u2013 Technical and Organisational Measures</p><p>This Annex outlines the minimum technical and organisational measures implemented by the Processor(s) to ensure the security of personal data.\n\n1. Access Control:\n  - Role-based access controls (RBAC) enforced at the application and infrastructure levels.\n  - Secure authentication methods including multi-factor authentication (MFA).\n  - Logging and regular review of access rights.\n\n2. Data Encryption:\n  - Encryption of personal data in transit using TLS 1.2 or higher.\n  - Encryption of personal data at rest using AES-256 or similar standard.\n\n3. Data Integrity and Confidentiality:\n  - Data is stored in secure cloud environments with strict segregation from unrelated data.\n  - Logical access to systems is restricted to authorised personnel under NDA/confidentiality obligations.\n\n4. Physical Security:\n  - Data centres used by sub-processors meet recognised security certifications (e.g. ISO 27001, SOC 2).\n\n5. Resilience and Availability:\n  - Regular backups and disaster recovery plans.\n  - Systems designed for high availability and failover.\n\n6. Incident Response:\n  - Formal incident response procedures in place.\n  - Breaches affecting personal data will be reported to the Controller without undue delay, and in any case within 48 hours.\n\n7. Training and Awareness:\n  - Regular privacy and security training for all employees involved in processing.\n\n8. Monitoring and Testing:\n  - Ongoing vulnerability scanning and penetration testing.\n  - Periodic security audits conducted by internal and external experts.</p><p>ANNEX III \u2013 Sub-Processor List and Data Transfer Mechanisms</p><p>Authorised Sub-processors:\nThe Controller authorises the use of the following sub-processors:</p><table><thead><tr><th>Sub-Processor</th><th>Purpose</th><th>Data Transfer Location</th><th>Legal Basis for Transfer</th></tr></thead><tbody><tr><td>HubSpot Inc.</td><td>CRM, marketing automation</td><td>EU</td><td>Standard Contractual Clauses (SCCs)</td></tr><tr><td>Microsoft Power BI</td><td>Business intelligence, reporting</td><td>EU</td><td>Standard Contractual Clauses (SCCs)</td></tr><tr><td>AirCall SAS</td><td>SMS Messaging, Whats App Messaging and Phone Calls</td><td>EU</td><td>Standard Contractual Clauses (SCCs) and supplementary measures</td></tr><tr><td>CData Software, Inc. \u2013 HubSpot Power BI Connector</td><td>HubSpot Power BI Connector for business intelligence and reporting.</td><td>US (transfer subject to section 8)</td><td>Standard Contractual Clauses (SCCs) \u2013 see section 8.</td></tr><tr><td>Datawarehouse.io LLC \u2013 HubSpot Power BI Connector</td><td>HubSpot Power BI Connector for business intelligence and reporting.</td><td>US (transfer subject to section 8)</td><td>Standard Contractual Clauses (SCCs) \u2013 see section 8.</td></tr><tr><td>Meta</td><td>WhatsApp and Social Media Marketing</td><td>EU</td><td>See section 8 where applicable.</td></tr><tr><td>Pfalzkom</td><td>Server &amp; hosting services</td><td>EU</td><td>See section 8 where applicable.</td></tr><tr><td>Ring Central</td><td>SMS Messaging, Whats App Messaging and Phone Calls</td><td>EU</td><td>See section 8 where applicable.</td></tr><tr><td>Healthcare Deutschland GmbH</td><td>Customer Service</td><td>EU</td><td>See section 8 where applicable.</td></tr><tr><td>ISP Services GmbH</td><td>Customer Service</td><td>EU</td><td>See section 8 where applicable.</td></tr><tr><td>ISP Services GmbH</td><td>Pharmacy</td><td>EU</td><td>See section 8 where applicable.</td></tr><tr><td>Apotheke an der Bergstrasse</td><td>Pharmacy</td><td></td><td>See section 8 where applicable.</td></tr></tbody></table><p>Sub-Processor Obligations:\n- Processor shall ensure each Sub-processor is subject to a written agreement that imposes equivalent data protection obligations.</p>"};

  if(/(^|[\/\-_?&=])en([\/\-_?&=]|$)/.test(path)) pref='en';
