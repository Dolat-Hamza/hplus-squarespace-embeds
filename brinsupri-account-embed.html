<!-- H+ form: paste ENTIRE block into ONE Squarespace Code Block (Business plan+). One form per page. -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --blue:#007EC6;--blue-2:#0567A1;--blue-3:#064B73;--ink-head:#06324C;--blue-050:#E6F3FB;
  --ink:#24272A;--muted:#71777C;--hair:#DCE2E6;--grey:#9D9D9C;
  --teal:#0FB5A5;--coral:#FF6A5A;--gold:#F5B83D;--ok:#1EA672;--error:#FF6A5A;
  --page:#F6F8F9;--card:#FFFFFF;
  --font-head:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --radius-card:22px;--radius-btn:999px;
}
.hplus-root *{box-sizing:border-box}
.hplus-root{font-family:var(--font-body);color:var(--ink);background:var(--page);
  padding:24px 16px 48px;line-height:1.5;-webkit-font-smoothing:antialiased;color-scheme:light;}
.hplus-root .hplus-wrap{max-width:820px;margin:0 auto}
.hplus-root h1, .hplus-root h2, .hplus-root h3, .hplus-root h4, .hplus-root .font-head{font-family:var(--font-head)}
.hplus-root .langswitch{display:flex;justify-content:flex-end;margin-bottom:12px}
.hplus-root .langswitch .seg{display:inline-flex;background:#fff;border:1px solid var(--hair);border-radius:99px;overflow:hidden;box-shadow:0 6px 16px -12px rgba(6,50,76,.35)}
.hplus-root .langswitch button{font-family:var(--font-head);font-size:13px;font-weight:600;border:none;background:transparent;color:var(--muted);padding:8px 18px;cursor:pointer;transition:.15s;letter-spacing:.03em}
.hplus-root .langswitch button.active{background:var(--blue);color:#fff}
.hplus-root .hero{display:grid;grid-template-columns:1.12fr .88fr;border-radius:24px;margin-bottom:20px;overflow:hidden;box-shadow:0 20px 44px -22px rgba(6,50,76,.6);}
.hplus-root .hero-copy{background:linear-gradient(135deg,var(--blue) 0%,var(--blue-2) 55%,var(--blue-3) 100%);color:#fff;padding:36px 32px;}
.hplus-root .hero-photo{position:relative;min-height:100%;background:#dfe7ec}
.hplus-root .hero-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 40%}
.hplus-root .hero .eyebrow{display:inline-block;font-family:var(--font-head);font-size:12px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;background:rgba(255,255,255,.16);padding:6px 14px;border-radius:20px;margin-bottom:16px;}
.hplus-root .hero h1{font-size:29px;line-height:1.18;font-weight:800;margin:0 0 12px}
.hplus-root .hero p{font-size:16px;font-weight:400;margin:0;opacity:.96}
.hplus-root .hero .hero-tie{font-family:var(--font-body);font-size:13.5px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.22);opacity:.95}
.hplus-root .hlogo{display:inline-block}
.hplus-root .hlogo-hero{height:34px;width:60px;color:#fff;margin-bottom:16px;display:block}
.hplus-root .hlogo-contact{height:26px;width:44px;color:var(--blue);flex:0 0 auto}
.hplus-root .contact-head{display:flex;align-items:center;gap:10px}
.hplus-root .benefits-title{font-family:var(--font-head);font-size:18px;font-weight:600;color:var(--ink-head);margin:2px 0 14px;display:flex;align-items:center;gap:9px}
.hplus-root .benefits-title svg{width:22px;height:22px;color:var(--blue)}
.hplus-root .benefits{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px;}
.hplus-root .benefit{background:#fff;border-radius:16px;padding:18px 18px 16px;border:1px solid var(--hair);box-shadow:0 6px 18px -14px rgba(6,50,76,.3);}
.hplus-root .benefit .ic{width:44px;height:44px;border-radius:12px;background:var(--blue-050);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.hplus-root .benefit .ic svg{width:26px;height:26px;color:var(--blue)}
.hplus-root .benefit b{display:block;font-family:var(--font-head);color:var(--ink-head);font-size:15px;font-weight:600;margin-bottom:4px}
.hplus-root .benefit span{font-size:13.5px;color:var(--muted)}
.hplus-root .ic-svg{width:1em;height:1em;color:currentColor}
.hplus-root .opt-card h4 .ic-chip, .hplus-root .reassure svg{flex:0 0 auto}
.hplus-root .opt-card h4 .ic-chip{width:34px;height:34px;border-radius:9px;background:var(--blue-050);display:inline-flex;align-items:center;justify-content:center}
.hplus-root .opt-card h4 .ic-chip svg{width:20px;height:20px;color:var(--blue)}
.hplus-root .reassure svg{width:15px;height:15px;color:var(--muted);margin-top:1px}
.hplus-root .note-error{color:var(--error)!important;font-weight:600}
.hplus-root .contact{background:#fff;border:1px solid var(--hair);border-radius:16px;padding:20px 22px;margin-top:22px}
.hplus-root .contact h4{font-family:var(--font-head);font-size:15px;font-weight:600;color:var(--ink-head);margin:0 0 10px}
.hplus-root .contact .rowc{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink);padding:3px 0}
.hplus-root .contact .rowc svg{width:16px;height:16px;color:var(--blue);flex:0 0 auto}
.hplus-root .disclaimer{font-size:11.5px;color:var(--grey);line-height:1.55;margin-top:16px;text-align:center}
.hplus-root .trustbar{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;font-family:var(--font-head);font-size:13px;font-weight:500;color:var(--blue-2);background:var(--blue-050);border-radius:16px;padding:12px 16px;margin-bottom:26px;}
.hplus-root .card{background:var(--card);border-radius:var(--radius-card);padding:30px 32px 34px;box-shadow:0 20px 50px -30px rgba(6,50,76,.5);border:1px solid #eef2f5;}
.hplus-root .progress{margin-bottom:26px}
.hplus-root .progress-track{height:8px;background:#e7edf1;border-radius:99px;overflow:hidden}
.hplus-root .progress-line{height:100%;width:25%;background:linear-gradient(90deg,var(--blue),var(--teal));border-radius:99px;transition:width .35s ease}

.hplus-root .progress-steps li{list-style:none;font-family:var(--font-head);font-size:12.5px;font-weight:500;color:var(--grey);flex:1;text-align:center;cursor:pointer;transition:.15s;padding:4px 2px;border-radius:8px}
.hplus-root .progress-steps li:hover{color:var(--blue);background:var(--blue-050)}
.hplus-root .progress-steps li.active{color:var(--blue)}
.hplus-root .progress-steps li.done{color:var(--ok)}
.hplus-root .step{display:none;animation:fade .3s ease}
.hplus-root .step.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hplus-root .step-title{font-size:22px;font-weight:700;color:var(--ink-head);margin:0 0 4px}
.hplus-root .step-sub{font-size:15px;color:var(--muted);margin:0 0 22px}
.hplus-root .substep-tag{display:inline-block;font-family:var(--font-head);font-size:12px;font-weight:600;color:var(--blue);background:var(--blue-050);padding:5px 12px;border-radius:99px;margin-bottom:16px;letter-spacing:.02em}
.hplus-root .sub3{display:none}
.hplus-root .sub3.active{display:block;animation:fade .3s ease}
.hplus-root .field{margin-bottom:20px}
.hplus-root .field > label:not(.choice), .hplus-root .group-label{display:block;font-family:var(--font-head);font-size:15px;font-weight:600;color:var(--blue-2);margin-bottom:8px;}
.hplus-root .reassure{font-size:12.5px;color:var(--muted);margin-top:6px;display:flex;gap:6px;align-items:flex-start}
.hplus-root input[type=text], .hplus-root input[type=email], .hplus-root input[type=tel], .hplus-root input[type=date], .hplus-root select, .hplus-root textarea{
  width:100%;font-family:var(--font-body);font-size:16px;color:var(--ink);background:var(--page);
  border:1px solid var(--hair);border-radius:10px;padding:12px 13px;outline:none;transition:border-color .15s,box-shadow .15s;}
.hplus-root textarea{min-height:80px;resize:vertical}
.hplus-root input:focus, .hplus-root select:focus, .hplus-root textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,126,198,.16)}
.hplus-root .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hplus-root .phone-row{display:flex;gap:8px}
.hplus-root .phone-row .cc-select{flex:0 0 92px;padding:12px 6px;font-size:14px}
.hplus-root .phone-row input{flex:1;min-width:0}
.hplus-root .choice{display:flex;align-items:center;gap:16px;padding:16px 18px;border:1px solid var(--hair);border-radius:12px;cursor:pointer;margin-bottom:10px;transition:.15s;background:#fff;}
.hplus-root .choice.top{align-items:center}
.hplus-root .choice:hover{border-color:var(--blue);background:#fbfdfe}
.hplus-root .choice input[type=checkbox], .hplus-root .choice input[type=radio]{
  appearance:none;-webkit-appearance:none;-moz-appearance:none;
  width:20px;height:20px;margin:0;padding:0;flex:0 0 auto;align-self:center;
  border:2px solid var(--hair);background:#fff;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  transition:border-color .15s,background-color .15s;
}
.hplus-root .choice input[type=checkbox]{border-radius:5px}
.hplus-root .choice input[type=radio]{border-radius:50%}

.hplus-root .choice input[type=checkbox]:checked::after{content:'';width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(40deg) translate(-1px,-1px)}
.hplus-root .choice input[type=radio]:checked::after{content:'';width:8px;height:8px;border-radius:50%;background:#fff}
.hplus-root .choice input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hplus-root .choice .ctxt{font-family:var(--font-body);font-size:15px;line-height:1.4;color:var(--ink);font-weight:500}
.hplus-root .choice .ctxt small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px;line-height:1.4}
.hplus-root .choice.selected{}
.hplus-root .pill-row{display:flex;flex-wrap:wrap;gap:10px}
.hplus-root .pill-row .choice{flex:1;min-width:150px;margin-bottom:0}
.hplus-root .section-head{font-family:var(--font-head);font-size:16px;font-weight:600;color:var(--ink-head);margin:24px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--hair)}
.hplus-root .section-head:first-child{margin-top:0}
.hplus-root .section-head.lg{font-size:22px;font-weight:700;margin-top:0}
.hplus-root .modal-ov{position:fixed;inset:0;background:rgba(6,50,76,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:9999}
.hplus-root .modal-ov.open{display:flex}
.hplus-root .modal{background:#fff;border-radius:20px;max-width:460px;width:100%;padding:30px 28px;box-shadow:0 30px 70px -20px rgba(6,50,76,.6);font-family:var(--font-body);color:var(--ink)}
.hplus-root .modal h3{font-family:var(--font-head);font-size:20px;font-weight:700;color:var(--ink-head);margin:0 0 10px;text-align:center}
.hplus-root .modal p{font-family:var(--font-body);font-size:14.5px;color:var(--muted);margin:0 0 12px;line-height:1.55}
.hplus-root .modal .mben{list-style:none;padding:0;margin:14px 0}
.hplus-root .modal .mben li{display:flex;gap:10px;align-items:flex-start;font-family:var(--font-body);font-size:14px;color:var(--ink);margin:9px 0}
.hplus-root .modal .mben svg{width:20px;height:20px;color:var(--ok);flex:0 0 auto;margin-top:1px}
.hplus-root .modal-actions{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.hplus-root .btn-outline{background:#fff;border:1.5px solid var(--muted);color:var(--muted);font-family:var(--font-head);font-weight:600;border-radius:999px;padding:12px 20px;cursor:pointer;font-size:15px}
.hplus-root .btn-outline:hover{border-color:var(--blue);color:var(--blue)}
.hplus-root .consent-scroll{border:1px solid var(--hair);border-radius:12px;background:#fbfdfe;padding:14px 16px;
  max-height:140px;overflow-y:auto;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.hplus-root .consent-scroll::-webkit-scrollbar{width:8px}
.hplus-root .consent-scroll::-webkit-scrollbar-thumb{background:#c7d4dd;border-radius:8px}
.hplus-root .consent-scroll::-webkit-scrollbar-track{background:transparent}
.hplus-root .consent-link{display:inline-flex;align-items:center;color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:3px;margin:2px 0 16px}
.hplus-root .consent-title{font-family:var(--font-head);font-size:21px;font-weight:700;color:var(--blue);margin:0 0 4px}
.hplus-root .consent-sub{font-family:var(--font-body);font-size:14px;color:var(--muted);margin:0 0 12px}
.hplus-root #hcpConsentGroup{margin-top:24px;padding-top:20px;border-top:1px solid var(--hair)}
.hplus-root .consent-text{font-family:var(--font-body);font-size:13px;line-height:1.6;color:var(--ink);font-weight:400}
.hplus-root .consent-text strong{font-weight:700;color:var(--ink-head)}
.hplus-root .pac-container{z-index:100000!important;font-family:var(--font-body)!important;border-radius:10px;box-shadow:0 12px 30px -12px rgba(6,50,76,.5);border:1px solid var(--hair);margin-top:4px}
.hplus-root .pac-item{padding:8px 12px;font-size:14px;color:var(--ink);cursor:pointer;border-top:1px solid #eef2f5}
.hplus-root .pac-item:hover{background:var(--blue-050)}
.hplus-root .pac-item-query{font-size:14px;color:var(--ink-head)}
.hplus-root .pac-icon{display:none}
.hplus-root .pac-logo:after{margin:4px 8px}
.hplus-root .bluebox{background:rgba(5,103,161,.10);border:1px solid rgba(5,103,161,.30);border-radius:12px;padding:14px 16px;margin:14px 0}
.hplus-root .bluebox b{display:flex;gap:8px;align-items:center;font-family:var(--font-head);color:var(--blue-2);font-size:15px;font-weight:600;margin-bottom:6px}
.hplus-root .bluebox b svg{width:18px;height:18px;color:var(--ok);flex:0 0 auto}
.hplus-root .bluebox p{font-family:var(--font-body);font-size:13px;color:var(--muted);margin:0;line-height:1.55}
.hplus-root .freechoice-note{margin-top:16px;padding-top:14px;border-top:1px solid var(--hair)}
.hplus-root .freechoice-note b{display:flex;gap:8px;align-items:center;font-family:var(--font-head);color:var(--blue-2);font-size:14px;font-weight:600;margin-bottom:5px}
.hplus-root .freechoice-note b svg{width:16px;height:16px;color:var(--ok);flex:0 0 auto}
.hplus-root .freechoice-note p{font-family:var(--font-body);font-size:12.5px;color:var(--muted);margin:0;line-height:1.55}
.hplus-root .linkbtn{background:none;border:none;color:var(--blue);font-family:var(--font-body);font-weight:600;font-size:14px;cursor:pointer;padding:4px 0;text-decoration:underline}
.hplus-root .searchbtn{display:inline-flex;align-items:center;gap:8px;background:var(--blue-050);border:1px solid var(--hair);color:var(--blue-2);font-family:var(--font-head);font-weight:600;font-size:14.5px;border-radius:10px;padding:12px 16px;cursor:pointer;width:100%;justify-content:center}
.hplus-root .searchbtn svg{width:18px;height:18px}
.hplus-root .pac-container{z-index:100000!important}
.hplus-root gmp-place-autocomplete{width:100%;display:block;margin-bottom:6px;color-scheme:light;background:#fff}
.hplus-root gmp-place-autocomplete::part(input){background:#fff;color:#24272A}
.hplus-root .opt-card{border:1px solid var(--hair);border-radius:16px;padding:20px 22px;margin-bottom:16px;transition:.15s;background:#fff}
.hplus-root .opt-card:hover{border-color:var(--blue)}
.hplus-root .opt-card.selected{}
.hplus-root .opt-card h4{font-size:17px;font-weight:600;color:var(--ink-head);margin:0 0 8px;display:flex;align-items:center;gap:9px}
.hplus-root .opt-card h4 .ic{font-size:20px}
.hplus-root .opt-card p{font-size:14.5px;color:var(--muted);margin:0 0 14px;line-height:1.55}
.hplus-root .opt-card .choice{margin-bottom:0}

.hplus-root .consent-box .choice{border:1px solid var(--hair)}
.hplus-root .gdpr-note{font-size:12.5px;color:var(--muted);background:var(--page);border:1px solid var(--hair);border-radius:12px;padding:13px 15px;margin-top:12px;line-height:1.55}
.hplus-root .gdpr-note b{color:var(--ink-head);font-family:var(--font-head)}
.hplus-root .callback-box{border:1px dashed var(--blue);background:var(--blue-050);border-radius:14px;padding:16px 18px;margin-top:20px}
.hplus-root .callback-box h4{font-size:15px;font-weight:600;color:var(--ink-head);margin:0 0 6px}
.hplus-root .callback-box p{font-size:13.5px;color:var(--muted);margin:0 0 12px}
.hplus-root .or-div{text-align:center;color:var(--grey);font-family:var(--font-head);font-size:12px;font-weight:600;letter-spacing:.1em;margin:18px 0;text-transform:uppercase}
.hplus-root .medcard{border:1px solid var(--hair);border-radius:16px;padding:18px 20px;background:#fbfdfe;margin-bottom:22px;}
.hplus-root .medcard h4{margin:0 0 10px;color:var(--blue-2);font-size:16px;font-weight:600}
.hplus-root .medcard dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:15px}
.hplus-root .medcard dt{color:var(--muted);font-weight:500}
.hplus-root .medcard dd{margin:0;font-weight:600;color:var(--ink-head);font-family:var(--font-head)}
.hplus-root .notice{background:#FFF6E9;border:1px solid #f6dca6;border-radius:12px;padding:12px 14px;font-size:13.5px;color:#8a6410;margin-bottom:18px}
.hplus-root .review-block{border:1px solid var(--hair);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.hplus-root .review-block h4{margin:0 0 8px;font-size:15px;font-weight:600;color:var(--blue-2);display:flex;justify-content:space-between}
.hplus-root .review-block h4 a{font-size:13px;color:var(--blue);text-decoration:none;font-weight:600;cursor:pointer;font-family:var(--font-body)}
.hplus-root .review-block .row{font-size:14px;display:flex;justify-content:space-between;gap:16px;padding:3px 0;color:var(--ink)}

.hplus-root .review-block .row .rv-right{text-align:right;max-width:60%}
.hplus-root .svc{display:flex;align-items:center;gap:11px;font-size:14px;padding:7px 0;color:var(--ink)}

.hplus-root .svc .svc-ic{flex:0 0 auto;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}

.hplus-root .svc.off span:last-child{color:var(--muted)}
.hplus-root .err-msg{color:var(--error);font-size:13px;font-weight:600;margin-top:6px;display:none}

.hplus-root .field.invalid .err-msg, .hplus-root .err-msg.show{display:block}
.hplus-root .field[data-required] > label::after,.hplus-root label.req::after{content:' *';color:var(--error);font-weight:700}
.hplus-root .nav{display:flex;justify-content:space-between;align-items:center;margin-top:28px;gap:12px}
.hplus-root .btn{font-family:var(--font-head);font-size:17px;font-weight:600;border:none;cursor:pointer;border-radius:var(--radius-btn);padding:13px 38px;transition:.18s;}
.hplus-root .btn-primary{background:var(--blue);color:#fff;box-shadow:0 12px 26px -14px rgba(0,126,198,.85)}
.hplus-root .btn-primary:hover{background:var(--blue-2)}
.hplus-root .btn-primary:disabled{opacity:.6;cursor:not-allowed}
.hplus-root .btn-ghost{background:transparent;color:var(--muted);padding:13px 18px}
.hplus-root .btn-ghost:hover{color:var(--blue)}
.hplus-root .step-hint{text-align:center;font-size:13px;color:var(--muted);margin-top:14px}
.hplus-root .success{display:none;text-align:center;padding:20px 10px}
.hplus-root .success .tick{width:76px;height:76px;border-radius:50%;background:var(--blue-050);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;color:var(--ok)}
.hplus-root .success h2{color:var(--ink-head);font-size:26px;font-weight:700;margin:0 0 10px}
.hplus-root .success p{color:var(--muted);font-size:16px;max-width:50ch;margin:0 auto 8px}
.hplus-root .submit-error{display:none;background:#fdecec;border:1px solid #f5b5b5;color:#a11;border-radius:12px;padding:12px 14px;font-size:14px;margin-top:16px}
.hplus-root .nextsteps{text-align:left;margin-top:28px;border-top:1px solid var(--hair);padding-top:24px}
.hplus-root .nextsteps h3{font-family:var(--font-head);font-size:17px;font-weight:600;color:var(--ink-head);margin:0 0 18px;text-align:center}
.hplus-root .nstep{display:flex;gap:14px;margin-bottom:18px;align-items:flex-start}
.hplus-root .nstep .nicon{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;font-family:var(--font-head);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center}
.hplus-root .nstep .ntxt b{display:block;font-family:var(--font-head);font-size:15px;font-weight:600;color:var(--ink-head);margin-bottom:3px}
.hplus-root .nstep .ntxt span{font-size:14px;color:var(--muted);line-height:1.55}
.hplus-root .nstep .ntxt .pill{display:inline-block;margin-top:6px;font-size:12px;font-weight:600;color:var(--blue)}
@media(max-width:640px){
.hplus-root .hero{padding:28px 22px}
.hplus-root .hero h1{font-size:25px}
.hplus-root .card{padding:24px 20px 28px}
.hplus-root .benefits{grid-template-columns:1fr}
.hplus-root .two-col{grid-template-columns:1fr}
.hplus-root .progress-steps li{font-size:11px}
}

/* ---- mobile optimisation (added) ---- */
@media(max-width:640px){
  .hplus-root{overflow-x:hidden;padding-left:12px;padding-right:12px}
  .hplus-root .hplus-wrap{max-width:100%}
  .hplus-root .hero{grid-template-columns:1fr !important}
  .hplus-root .hero-photo{min-height:190px}
  .hplus-root .hero-copy{padding:24px 20px !important}
  .hplus-root .hero h1{font-size:23px !important}
  .hplus-root .hero p{font-size:15px !important}
  .hplus-root .pill-row .choice{flex:1 1 100% !important;min-width:0 !important}
  .hplus-root .trustbar{font-size:11.5px;gap:6px 12px}
  .hplus-root .progress-steps li{font-size:10.5px;padding:3px 1px;letter-spacing:0}
  .hplus-root .two-col{grid-template-columns:1fr !important}
  .hplus-root .step-title{font-size:20px}
  .hplus-root .contact .rowc{font-size:13px;align-items:flex-start}
}

<div class="hplus-wrap">

  <!-- LANGUAGE SWITCHER -->
  <div class="langswitch"><div class="seg">
    <button type="button" data-lang="de" class="active">DE</button>
    <button type="button" data-lang="en">EN</button>
  </div></div>

    <span data-i18n="trust1"></span><span data-i18n="trust2"></span>

  </div>

  <!-- FORM CARD -->
  <div class="card">
    <div class="progress" id="progressWrap">
      <div class="progress-track"><div class="progress-line" id="progressLine"></div></div>
      <ul class="progress-steps" id="progressSteps">
        <li data-s="1" class="active" data-i18n="step1_name"></li>
        <li data-s="2" data-i18n="step2_name"></li>
        <li data-s="3" data-i18n="step3_name"></li>
        <li data-s="4" data-i18n="step4_name"></li>
      </ul>
    </div>

    <form id="hplusForm" novalidate>

      <!-- STEP 1 : Registration -->
      <section class="step active" data-step="1">
        <h3 class="step-title" data-i18n="s1_title"></h3>
        <p class="step-sub" data-i18n="s1_sub"></p>

        <div class="field" data-required>
          <label data-i18n="role_label"></label>
          <select id="customer_type">
            <option value="" data-i18n="opt_select"></option>
            <option value="Patient" data-i18n="opt_patient"></option>
            <option value="Caregiver" data-i18n="opt_caregiver"></option>
          </select>
          <div class="err-msg" data-i18n="err_select"></div>
        </div>

        <h4 class="section-head" data-i18n="patient_details_h"></h4>

        <div class="two-col">
          <div class="field" data-required><label data-i18n="firstname_label"></label><input type="text" id="firstname" autocomplete="given-name" /><div class="err-msg" data-i18n="err_first"></div></div>
          <div class="field" data-required><label data-i18n="lastname_label"></label><input type="text" id="lastname" autocomplete="family-name" /><div class="err-msg" data-i18n="err_last"></div></div>
        </div>

        <div class="field" data-required>
          <label data-i18n="email_label"></label>
          <input type="email" id="email" autocomplete="email" data-validate="email" />
          <div class="reassure"><svg><use href="#ic-lock"/></svg><span data-i18n="email_reassure"></span></div>
        </div>

        <div class="field" data-required data-group="comm">
          <span class="group-label" data-i18n="comm_label"></span>
          <div class="pill-row" id="comm_prefs">
            <label class="choice"><input type="checkbox" value="Email"><span class="ctxt" data-i18n="opt_email"></span></label>
            <label class="choice"><input type="checkbox" value="Whatsapp"><span class="ctxt" data-i18n="opt_whatsapp"></span></label>
            <label class="choice"><input type="checkbox" value="Phone"><span class="ctxt" data-i18n="opt_phone"></span></label>
            <label class="choice"><input type="checkbox" value="SMS"><span class="ctxt" data-i18n="opt_sms"></span></label>
          </div>
          <div class="err-msg" data-i18n="err_comm"></div>
        </div>

        <div class="field cond" id="c_whatsapp" style="display:none"><label data-i18n="whatsapp_label"></label><input type="tel" id="patient_whatsapp" placeholder="+49 176 1234567" inputmode="tel" autocomplete="tel" data-validate="phone-global" /></div>
        <div class="field cond" id="c_phone" style="display:none"><label data-i18n="phone_label"></label><div class="phone-row"><select id="patient_phone_cc" class="cc-select"><option value="+49">ð©ðª +49</option><option value="+43">ð¦ð¹ +43</option></select><input type="tel" id="patient_phone" placeholder="176 1234567" data-validate="phone" /></div></div>
        <div class="field cond" id="c_sms" style="display:none"><label data-i18n="sms_label"></label><div class="phone-row"><select id="patient_sms_cc" class="cc-select"><option value="+49">ð©ðª +49</option><option value="+43">ð¦ð¹ +43</option></select><input type="tel" id="patient_sms" placeholder="176 1234567" data-validate="phone" /></div></div>

        <div class="field" data-required>

function fillFromComponents(comps, name, phone){
  const street=[comps.route, comps.street_number].filter(Boolean).join(' ');
  if(name)  $('doctor_street2').value=name;
  if(street)$('doctor_street').value=street;
  if(comps.postal_code) $('doctor_postcode').value=comps.postal_code;
  if(comps.locality) $('doctor_street').value = ($('doctor_street').value ? $('doctor_street').value+', ' : '') + comps.locality;
  if(phone){
    // Google returns the full international number (e.g. "+49 30 1234567"); the field
    // already has a country-code selector, so strip the leading +CC to avoid doubling it.
    let p=String(phone).trim();
    const m=p.match(/^\+(\d{1,3})[\s\-]*(.*)$/);
    if(m){ const cc='+'+m[1], nat=m[2].replace(/\s+/g,' ').trim();
      const sel=$('doctor_phone_cc'); if(sel && [...sel.options].some(o=>o.value===cc)){ sel.value=cc; sel.dataset.touched='1'; }
      $('doctor_phone').value=nat;

  $('addressFields').style.display='block';
}

}
async function initAutocomplete(){
  if(placesInited) return; placesInited=true;
  const at=val('country')==='Ãsterreich';
  try{
    const { PlaceAutocompleteElement } = await google.maps.importLibrary('places');
    const pac = new PlaceAutocompleteElement({ includedRegionCodes:[at?'at':'de'] });
    pac.style.width='100%';
    const box=$('practiceSearchBox');
    $('practiceSearch').style.display='none';
    box.insertBefore(pac, box.firstChild);
    // user picks a prediction â fetch details â fill address fields
    pac.addEventListener('gmp-select', async (ev)=>{
      try{
        const pred = ev.placePrediction || (ev.detail && ev.detail.placePrediction);
        const place = pred.toPlace();
        await place.fetchFields({ fields:['displayName','addressComponents','internationalPhoneNumber'] });
        const comps={}; (place.addressComponents||[]).forEach(c=>(c.types||[]).forEach(ty=>comps[ty]=c.longText));
        fillFromComponents(comps, place.displayName, place.internationalPhoneNumber);
      }catch(e){ placesFailed('fetchFields error: '+e.message); }
    });
    pac.addEventListener('gmp-error', ()=>placesFailed('PlaceAutocompleteElement error event'));
  }catch(e){ placesFailed('init failed â enable "Places API (New)" for the key. '+e.message); }
}

/* ---- format validators (mirror the HubSpot phone/email checks) ---- */
/* country-aware: DE national numbers run 6â11 digits, AT 4â13 (after stripping a leading 0) */
function phoneOk(v,cc){
  const d=v.replace(/\D/g,'').replace(/^0+/,'');
  if(!/^[+()\-.\s\/0-9]+$/.test(v)) return false;
  return cc==='+43' ? /^[1-9]\d{3,12}$/.test(d) : /^[1-9]\d{5,10}$/.test(d);
}
function globalPhoneOk(v){ const compact=v.replace(/[\s().\-/]/g,''); return /^\+[1-9]\d{7,14}$/.test(compact); }
function formatOk(inp){ const v=inp.value.trim(); return inp.dataset.validate==='email'?emailOk(v):inp.dataset.validate==='phone-global'?globalPhoneOk(v):phoneOk(v,ccOf(inp)); }
function formatErrorKey(inp){ return inp.dataset.validate==='email'?'err_email_fmt':inp.dataset.validate==='phone-global'?'err_whatsapp_global':'err_phone'; }
function ccOf(inp){ const sel=document.getElementById(inp.id+'_cc'); return sel?sel.value:'+49'; }
/* compose the full number (country code + national number) for submission */
function phoneFull(id){
  const inp=$(id); if(!inp) return '';
  const v=inp.value.trim(); if(!v) return '';
  if(inp.dataset.validate==='phone-global') return '+'+v.replace(/\D/g,'');
  return (ccOf(inp)+' '+v.replace(/^0+/,'')).trim();
}
function ensureFmtErr(f,msg){ let e=f.querySelector('.err-msg.fmt'); if(!e){ e=document.createElement('div'); e.className='err-msg fmt'; f.appendChild(e);} e.textContent=msg; }
function clearScope(scope){ scope.querySelectorAll('.field.invalid').forEach(f=>f.classList.remove('invalid')); scope.querySelectorAll('.err-msg.fmt').forEach(e=>e.remove()); }
/* validate every visible, filled [data-validate] input in scope */
function validateFormats(scope){
  let ok=true;
  scope.querySelectorAll('input[data-validate]').forEach(inp=>{
    const f=inp.closest('.field'); if(!f || f.offsetParent===null) return;    // skip hidden
    const v=inp.value.trim(); if(!v) return;                                   // empty â required logic handles it
    const bad = !formatOk(inp);
    if(bad){ f.classList.add('invalid'); ensureFmtErr(f,t(formatErrorKey(inp))); ok=false; }
  });
  return ok;
}
/* require a field when a condition is met (e.g. contact number for a chosen method) */
function requireIf(inputId, cond){
  if(!cond) return true;
  const inp=$(inputId), f=inp.closest('.field');
  if(inp.value.trim()===''){ f.classList.add('invalid'); ensureFmtErr(f,t('err_required')); return false; }
  return true;
}

/* generic validation for steps 1 & 2 */
function validateStep(n){
  let ok=true;
  const stepEl=document.querySelector(`.step[data-step="${n}"]`);
  clearScope(stepEl);
  stepEl.querySelectorAll('.field[data-required]').forEach(f=>{
    let bad=false;
    if(f.dataset.group==='comm'){ bad=multi('#comm_prefs input')===''; }
    else{
      const input=f.querySelector('input[type=text],input[type=email],input[type=date],select,textarea');
      const radios=f.querySelectorAll('input[type=radio]');
      const cb=f.querySelector('input[type=checkbox]');
      if(radios.length){ bad=![...radios].some(r=>r.checked); }
      else if(cb && !input){ bad=!cb.checked; }
      else if(input){ bad=input.value.trim()===''; }   // format (email/phone) is validated exclusively by validateFormats() below â avoids duplicate error messages
    }
    markInvalid(f,bad);
    if(bad){
      ok=false;
      const dv=f.querySelector('input[data-validate]');
      if(dv) ensureFmtErr(f, t(dv.dataset.validate==='email'?'err_email':'err_required'));  // empty required field with no static message (e.g. email) still gets one
    }
  });
  if(!validateFormats(stepEl)) ok=false;
  if(n===1){
    const cm=v=>document.querySelector(`#comm_prefs input[value=${v}]`).checked;
    if(!requireIf('patient_whatsapp',cm('Whatsapp'))) ok=false;
    if(!requireIf('patient_phone',cm('Phone'))) ok=false;
    if(!requireIf('patient_sms',cm('SMS'))) ok=false;
    if(radio('second_person')==='Yes'){
      const cg=v=>document.querySelector(`#cg_comm_prefs input[value=${v}]`).checked;
      if(!requireIf('second_contact_whatsapp',cg('Whatsapp'))) ok=false;
      if(!requireIf('second_contact_phone',cg('Phone'))) ok=false;
      if(!requireIf('caregiver_sms',cg('SMS'))) ok=false;
      if(!requireIf('second_contact_email',cg('Email'))) ok=false;
    }
  }
  return ok;
}

/* step-3 sub validation */
function validateSub3(n){
  let ok=true;
  if(n===1){
    const anyOpt=checked('delivery_management')||checked('prescription_management')||checked('check_up_reminder_management')||radio('reminder_freq')!==''||checked('no_support');
    showErr('optionsErr',!anyOpt); if(!anyOpt) ok=false;
    // repeat prescriptions require delivery too (user must actively opt in)
    const rxNeedsDelivery = checked('prescription_management') && !checked('delivery_management');
    $('rxNote').classList.toggle('note-error',rxNeedsDelivery);
    if(rxNeedsDelivery){ ok=false; $('card_delivery').scrollIntoView({behavior:'smooth',block:'center'}); }
    showErr('freqErr',false);   // check-in frequency is optional â choosing none is fine
    if(checked('check_up_reminder_management')){ const af=$('appointment_date').closest('.field'), bad=val('appointment_date')===''; markInvalid(af,bad); if(bad){ok=false;af.scrollIntoView({behavior:'smooth',block:'center'});} }
  }
  if(n===2){   // DELIVERY consent page (shown when delivery || rx)
    clearScope($('sub32')); showErr('pharmacyErr',false);
    const bad=!checked('delivery_consent'); markInvalid($('deliveryConsentWrap'),bad); if(bad) ok=false;
    // Germany: pharmacy choice required once delivery consent given; alt-pharmacy details if chosen
    if((val('country')==='Deutschland'||val('country')==='Ãsterreich') && checked('delivery_consent')){
      const ph=radio('pharmacy_choice');
      showErr('pharmacyErr', ph===''); if(ph==='') ok=false;
      if(ph==='no'){
        ['chosen_pharmacy_name','chosen_pharmacy_street','chosen_pharmacy_city','chosen_pharmacy_postcode'].forEach(id=>{
          if(val(id)===''){ const f=$(id).closest('.field'); f.classList.add('invalid'); ensureFmtErr(f,t('err_required')); ok=false; }
        });
      }
    }
  }
  if(n===3){   // PRESCRIPTION consent page (shown when rx)
    clearScope($('sub33'));
    const bad=!checked('hcp_consent'); markInvalid($('hcpConsentWrap'),bad); if(bad) ok=false;
  }
  if(n===4){   // DOCTOR details page
    clearScope($('sub34')); $('callbackErr').classList.remove('show');
    if(checked('arrange_call')){
      const cv=val('callback_date'), cbEl=$('callback_date');
      if(cv===''){ markInvalid($('callbackWhen'),true); ok=false; }
      else if((cbEl.min && cv<cbEl.min) || (cbEl.max && cv>cbEl.max)){ $('callbackWhen').classList.add('invalid'); $('callbackErr').textContent=t('err_callback_range'); $('callbackErr').classList.add('show'); ok=false; }
      showErr('infoErr',false);
    } else {
      const complete = val('doctor_first') && val('doctor_last') && (val('doctor_street')||val('doctor_postcode')||val('doctor_street2')||val('doctor_phone')||val('doctor_email'));
      if(!complete){ showErr('infoErr',true); ok=false; $('cantFindBtn').scrollIntoView({behavior:'smooth',block:'center'}); }
      else showErr('infoErr',false);
    }
    if(!validateFormats($('sub34'))) ok=false;
  }
  return ok;
}
/* routing within step 3 (conditional 4-page sub-flow) â delivery form is sent on completion */
async function finishStep3(){ showStep(4); }
async function step3Next(from){
  const delivery=checked('delivery_management'), rx=checked('prescription_management'), none=checked('no_support');
  if(from===1){ if(!validateSub3(1)) return; if(none){ openNoSupportModal(); } else if(!delivery&&!rx){ await finishStep3(); } else { showSub3(2); } return; }
  if(from===2){ if(!validateSub3(2)) return; if(rx){ showSub3(3); } else { await finishStep3(); } return; }  // delivery consent â hcp consent (if rx) else review
  if(from===3){ if(!validateSub3(3)) return; showSub3(4); return; }                                          // hcp consent â doctor
  if(from===4){ if(!validateSub3(4)) return; await finishStep3(); return; }                                  // doctor â review
}
function step3Back(from){ if(from===1){ showStep(2); } else if(from===2){ showSub3(1); } else if(from===3){ showSub3(2); } else if(from===4){ showSub3(3); } }
$('s3next1').addEventListener('click',()=>step3Next(1));
$('s3next2').addEventListener('click',()=>step3Next(2));
$('s3next3').addEventListener('click',()=>step3Next(3));
$('s3next4').addEventListener('click',()=>step3Next(4));
$('s3back1').addEventListener('click',()=>step3Back(1));
$('s3back2').addEventListener('click',()=>step3Back(2));
$('s3back3').addEventListener('click',()=>step3Back(3));
$('s3back4').addEventListener('click',()=>step3Back(4));

/* full step-3 validation for final submit */
function validateStep3All(){
  if(!validateSub3(1)){ showStep(3); showSub3(1); return false; }
  const delivery=checked('delivery_management'), rx=checked('prescription_management'), none=checked('no_support');
  if(!none && (delivery||rx)){ if(!validateSub3(2)){ showStep(3); showSub3(2); return false; } }
  if(rx){
    if(!validateSub3(3)){ showStep(3); showSub3(3); return false; }
    if(!validateSub3(4)){ showStep(3); showSub3(4); return false; }
  }
  return true;
}

async function submitOne(guid,payload){
  const r=await fetch(endpoint(guid),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  if(!r.ok){ const x=await r.text().catch(()=> ''); throw new Error(`Form ${guid}: ${r.status} ${x.slice(0,180)}`); }
  return r.json();
}

/* progressive submit: each form is sent as its step completes; re-sent only if its
   data changed since the last send (dedup by payload signature â no duplicate events). */
const lastSent={registration:'',medical:'',delivery:''};
const payloadFor={registration:payloadRegistration,medical:payloadMedical,delivery:payloadDelivery};
async function sendStep(key){
  const p=buildPayload(key);                                 // adds clears + email-lock (see F1/F2 fixes)
  const sig=JSON.stringify(p.fields);
  if(sig===lastSent[key]) return true;                       // unchanged since last send
  try{ await submitOne(HS.forms[key],p); lastSent[key]=sig; return true; }
  catch(e){ console.warn('send failed:',key,e); return false; }
}

function validateOneField(inp){
  const f=inp.closest('.field'), v=inp.value.trim();
  f.querySelectorAll('.err-msg.fmt').forEach(e=>e.remove()); f.classList.remove('invalid');
  if(v && !formatOk(inp)){ f.classList.add('invalid'); ensureFmtErr(f,t(formatErrorKey(inp))); }
}
document.querySelectorAll('input[data-validate]').forEach(inp=>inp.addEventListener('blur',()=>validateOneField(inp)));
document.querySelectorAll('.cc-select').forEach(sel=>sel.addEventListener('change',()=>{
  const inp=$(sel.id.replace(/_cc$/,'')); if(inp && inp.value.trim()) validateOneField(inp);
}));

/* ============================================================
   PERSISTENCE â autofill on return + drop-out capture
   Field values are saved to THIS browser only (localStorage).
   Nothing leaves the device until a step's HubSpot form submits.
   (Same-device autofill; not cross-device known-contact prefill.)
   ============================================================ */
const LS_KEY='hplus_form_v1';
const _ctrls=()=>[...document.querySelectorAll('#hplusForm input,#hplusForm select,#hplusForm textarea')];
function saveState(){
  try{
    const s={};
    _ctrls().forEach((el,i)=>{
      if(el.type==='checkbox'||el.type==='radio'){ if(el.checked) s[i]=1; }
      else if(el.value!==''){ s[i]=el.value; }
    });
    localStorage.setItem(LS_KEY,JSON.stringify(s));
  }catch(e){}
}
function restoreState(){
  let s=null; try{ s=JSON.parse(localStorage.getItem(LS_KEY)||'null'); }catch(e){}
  if(!s) return false;
  const cs=_ctrls();
  Object.keys(s).forEach(k=>{ const el=cs[+k]; if(!el) return;
    if(el.type==='checkbox'||el.type==='radio'){ el.checked=!!s[k]; }
    else{ el.value=s[k]; }
  });
  // re-render every conditional UI element to match the restored values
  document.querySelectorAll('.choice input').forEach(inp=>{ const c=inp.closest('.choice'); if(c) c.classList.toggle('selected',inp.checked); });
  try{ syncCommFields(); syncCgCommFields(); }catch(e){}
  syncSecondPerson(); syncOptions(); syncConsentVisibility();
  return true;
}

/* drop-out capture: on tab close / hide, best-effort submit any completed-but-
   unsent step via sendBeacon (fire-and-forget, no CORS preflight). Gates are
   silent (no DOM mutation) so a mere tab-switch never paints validation errors.
   HubSpot upserts by email, so a beacon + a later full submit = one contact. */
function _canFlush(n){
  if(n===1) return !!(val('email')&&val('firstname')&&val('lastname')&&val('customer_type'));
  if(n===2) return !!(val('email'));
  if(n===3) return !!(val('email')&&(checked('delivery_management')||checked('prescription_management')||checked('check_up_reminder_management')||checked('no_support')));
  return false;
}
function beaconStep(key){
  try{
    const p=buildPayload(key);
    const sig=JSON.stringify(p.fields);
    if(sig===lastSent[key]) return;                       // already sent, unchanged
    const blob=new Blob([JSON.stringify(p)],{type:'application/json'});
    if(navigator.sendBeacon(endpoint(HS.forms[key]),blob)) lastSent[key]=sig;
  }catch(e){}
}

/* ---- F1: clear removed values ----
   buildPayload() wraps a step's payload so any field that was sent earlier but
   is now emptied is explicitly re-sent as '' to clear it in the backend.
   (An edited email intentionally creates a new contact â no email lock.)
   Backend-only; no UI change. */
const sentFields={registration:new Set(),medical:new Set(),delivery:new Set()};
function withClears(key,p){
  const present=new Set(p.fields.map(f=>f.name));
  sentFields[key].forEach(n=>{ if(!present.has(n)) p.fields.push(field(n,'')); });  // re-send emptied fields as ''
  p.fields.forEach(f=>sentFields[key].add(f.name));
  return p;
}
function buildPayload(key){ return withClears(key,payloadFor[key]()); }
function flushOnExit(){
  // drop-out capture: best-effort beacon of the account payload to 212bd920
  try{
    if(val('email')&&val('firstname')&&val('lastname')){
      const blob=new Blob([JSON.stringify(payloadAccount())],{type:'application/json'});
      navigator.sendBeacon(endpoint(ACCOUNT_GUID),blob);
    }
  }catch(e){}
  saveState();
}
window.addEventListener('pagehide',flushOnExit);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flushOnExit(); });

/* init */
applyLang(currentLang);
if(!/[?&](token|email)=/.test(location.search)) restoreState();  // prior-visit autofill — but a prefill link (token/email) is authoritative, so skip stale local data for returning customers
syncOptions(); syncConsentVisibility(); syncSecondPerson(); setupDates();
$('hplusForm').addEventListener('input',saveState);        // persist as the patient types
$('hplusForm').addEventListener('change',saveState);

/* Account form lands on the summary page; the prefill script re-syncs it once data arrives. */
window.__accShowStep = showStep;
window.__accBuildReview = buildReview;
showStep(4);

})();
</script>

<style>
#acctGate{max-width:820px;margin:0 auto 16px;background:#EAF4FB;border:1px solid #cfe6f5;border-radius:14px;padding:14px 16px;font-family:'Inter',system-ui,sans-serif;color:#06324C;font-size:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#acctGate .g-lbl{font-weight:600;flex:1 1 100%}

#acctPrefillNote{max-width:820px;margin:0 auto 16px;font-family:'Inter',system-ui,sans-serif;font-size:13.5px;color:#0567A1;background:#E7F6EF;border:1px solid #b9e6d1;border-radius:12px;padding:11px 15px;display:none}
</style>
<script>
(function(){
  var ACCOUNT_API = "https://hplus-account-api.vercel.app"; // deployed read-function
  function fire(el,ev){ try{ el.dispatchEvent(new Event(ev,{bubbles:true})); }catch(e){} }
  function setVal(id,v){ var e=document.getElementById(id); if(e){ e.value=v; fire(e,'input'); fire(e,'change'); } }
  function setCheck(id,on){ var e=document.getElementById(id); if(e){ e.checked=!!on; fire(e,'change'); } }
  function setRadio(name,val){ document.querySelectorAll('input[name="'+name+'"]').forEach(function(r){ if(r.value===val){ r.checked=true; fire(r,'change'); } }); }
  function setMulti(containerId,vals){ var box=document.getElementById(containerId)||document; box.querySelectorAll('input[type=checkbox]').forEach(function(c){ if((vals||[]).indexOf(c.value)>=0){ c.checked=true; fire(c,'change'); } }); }

  function apply(data){
    Object.keys(data).forEach(function(id){
      var it=data[id]; if(!it) return; var k=it.kind, v=it.value;
      if(k==='text'||k==='date'||k==='select') setVal(id,v);
      else if(k==='check') setCheck(id, v==='true');
      else if(k==='radio') setRadio(id, v);
      else if(k==='multi') setMulti(id, v);
    });
    var note=document.getElementById('acctPrefillNote');
    if(note){ note.style.display='block'; note.textContent='Ihre gespeicherten Angaben wurden geladen. Bitte prÃ¼fen und aktualisieren Sie sie unten. Â· Your saved details were loaded â review and update them below.'; }
    // re-sync the summary page now that the saved data has populated the fields
    try{ if(window.__accShowStep) window.__accShowStep(4); else if(window.__accBuildReview) window.__accBuildReview(); }catch(e){}
  }

  function prefill(qs){
    fetch(ACCOUNT_API+'/api/account/prefill?'+qs)
      .then(function(r){ return r.json(); })
      .then(function(j){ if(j && j.ok && j.data) apply(j.data); else showGate('Dieser Link ist ungÃ¼ltig oder abgelaufen. Â· This link is invalid or expired.'); })
      .catch(function(){ showGate('Angaben konnten nicht geladen werden. Â· Could not load your details.'); });
  }

  function showGate(msg){
    if(document.getElementById('acctGate')) { if(msg){var m=document.querySelector('#acctGate .g-msg'); if(m)m.textContent=msg;} return; }
    var root=document.querySelector('.hplus-wrap')||document.body;
    var g=document.createElement('div'); g.id='acctGate';
    g.innerHTML='<span class="g-lbl">Bereits registriert? Geben Sie Ihre E-Mail ein, um Ihre gespeicherten Angaben zu bearbeiten. Â· Already registered? Enter your email to edit your saved details.</span>'+
      '<input type="email" id="acctEmail" placeholder="you@email.com" autocomplete="email">'+
      '<button type="button" id="acctSend">Link senden / Send link</button>'+
      '<span class="g-msg" id="acctMsg"></span>';
    root.insertBefore(g, root.firstChild);
    if(msg){ document.getElementById('acctMsg').textContent=msg; }
    document.getElementById('acctSend').addEventListener('click',function(){
      var em=(document.getElementById('acctEmail').value||'').trim();
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){ document.getElementById('acctMsg').textContent='Bitte gÃ¼ltige E-Mail eingeben. Â· Please enter a valid email.'; return; }
      this.disabled=true; this.textContent='â¦';
      fetch(ACCOUNT_API+'/api/account/request-link',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em})})
        .then(function(){ document.getElementById('acctMsg').textContent='Wenn diese E-Mail registriert ist, haben wir Ihnen einen Link gesendet. Bitte prÃ¼fen Sie Ihr Postfach. Â· If that email is registered, we sent you a link â check your inbox.'; })
        .catch(function(){ document.getElementById('acctMsg').textContent='Etwas ist schiefgelaufen. Bitte erneut versuchen. Â· Something went wrong, please try again.'; })
        .finally(function(){ var b=document.getElementById('acctSend'); b.disabled=false; b.textContent='Link senden / Send link'; });
    });
  }

  function boot(){
    var p=new URLSearchParams(location.search);
    var token=p.get('token'), email=p.get('email');
    if(token) prefill('token='+encodeURIComponent(token));
    else if(email) prefill('email='+encodeURIComponent(email));
    else showGate('');
  }
  if(document.readyState!=='loading') boot(); else document.addEventListener('DOMContentLoaded', boot);
})();
</script>
