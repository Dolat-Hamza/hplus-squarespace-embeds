<style>
.hplus-legal{--blue:#007EC6;--navy:#06324C;--text:#24272A;--muted:#71777C;--line:#DCE2E6;--wash:#F6F8F9;font-family:'Inter',sans-serif;color:var(--text);background:var(--wash);padding:clamp(24px,5vw,64px) 16px;line-height:1.65}
.hplus-legal *{box-sizing:border-box}
.hplus-legal__card{max-width:880px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:clamp(24px,5vw,52px);box-shadow:0 20px 50px -32px rgba(6,50,76,.45)}
.hplus-legal__eyebrow{color:var(--blue);font-weight:700;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase}
.hplus-legal__note{margin-top:32px;padding:14px 16px;border-radius:12px;background:#E6F3FB;color:#0567A1;font-size:.9rem}
.hplus-legal h1,.hplus-legal h2,.hplus-legal h3{font-family:'Poppins',sans-serif;color:var(--navy)}
.hplus-legal h1{font-size:clamp(1.7rem,4vw,2.6rem);line-height:1.2;margin:10px 0 16px}
.hplus-legal h2{font-size:1.15rem;margin:30px 0 8px}
.hplus-legal h3{font-size:1rem;margin:20px 0 6px}
.hplus-legal p,.hplus-legal li{margin:0 0 12px}
.hplus-legal ul{padding-left:20px}
.hplus-legal table{width:100%;border-collapse:collapse;margin:14px 0;font-size:.88rem}
.hplus-legal th,.hplus-legal td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.hplus-legal th{background:var(--wash)}
.hplus-legal a{color:var(--blue)}
.langswitch{display:flex;gap:6px;justify-content:flex-end;margin-bottom:6px}
.langswitch button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:5px 13px;font:inherit;font-size:.82rem;cursor:pointer}
.langswitch button.active{background:var(--navy);border-color:var(--navy);color:#fff}
@media(max-width:520px){.hplus-legal{padding:12px}.hplus-legal__card{border-radius:16px;padding:22px 18px}}

.uhp-header{padding-bottom:12px;margin-bottom:14px}
.uhp-header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;position:relative;padding:2px 0 16px;margin:0 0 20px}
.uhp-brand{display:inline-flex;align-items:center;gap:12px;text-decoration:none}
.uhp-brand svg{height:34px;width:58px;color:var(--blue);flex:0 0 auto}
.uhp-brand svg.uhp-logo{height:42px;width:auto;display:block;flex:0 0 auto}
.uhp-brand svg.uhp-logo{height:32px}
.uhp-brand .bt{line-height:1.05}
.uhp-brand .bt b{font-family:var(--font-head),'Poppins',sans-serif;font-weight:700;color:var(--ink-head);font-size:17px;letter-spacing:.01em;display:block}
.uhp-brand .bt small{display:block;font-family:var(--font-body);font-weight:600;color:var(--blue-2);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
.uhp-brand svg{height:28px;width:48px}
.uhp-brand .bt b{font-size:15px}
.uhp-header-right{display:flex;align-items:center;gap:12px}
.acct-btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--blue),var(--blue-3));color:#fff !important;font-family:var(--font-head),inherit;font-size:clamp(11px,.95vw,13.5px);font-weight:600;letter-spacing:.4px;line-height:1;text-transform:uppercase;text-decoration:none !important;padding:13px 20px;border-radius:999px;white-space:nowrap;box-shadow:0 12px 24px -12px rgba(0,126,198,.75);transition:opacity .2s ease,transform .2s ease,box-shadow .2s ease}
.acct-btn{font-size:12px;padding:11px 16px}
.acct-btn:hover{transform:translateY(-1px);box-shadow:0 16px 30px -12px rgba(0,126,198,.8)}
.uhp-avatar{width:42px;height:42px;display:block;object-fit:contain;border-radius:50%;box-shadow:0 4px 12px -6px rgba(6,50,76,.5)}
.uhp-avatar{width:36px;height:36px}
.uhp-footer{margin-top:26px;border-radius:22px;overflow:hidden;position:relative;background:linear-gradient(120deg,#06324C 0%,#064B73 48%,#007EC6 100%);color:#fff;padding:26px 30px;box-shadow:0 18px 44px -24px rgba(6,50,76,.55)}
.uhp-footer{padding:22px 20px;text-align:center}
.uhp-footer-top{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:14px 24px;flex-wrap:wrap}
.uhp-footer-top{justify-content:center}
.uhp-footer-brand svg.uhp-logo{height:34px;width:auto;display:block}
.uhp-footer-brand svg.uhp-logo .hl-word{fill:#fff}
.uhp-footer-brand{display:flex;align-items:center;gap:12px}
.uhp-footer-brand svg{height:30px;width:52px;color:#fff}
.uhp-footer-brand span{font-family:var(--font-head),'Poppins',sans-serif;font-weight:600;font-size:15px}
.uhp-footer-links{display:flex;gap:18px;flex-wrap:wrap}
.uhp-footer-links a{color:#D5E7F2;text-decoration:none;font-family:var(--font-body);font-size:13.5px;font-weight:500;transition:color .15s}
.uhp-footer-links a:hover{color:#fff}
.uhp-footer-links{justify-content:center}
.uhp-footer-bottom{position:relative;z-index:1;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.18);font-family:var(--font-body);font-size:12px;color:#BCDFF5}
.bt{line-height:1.05}
.bt b{font-family:var(--font-head),'Poppins',sans-serif;font-weight:700;color:var(--ink-head);font-size:17px;letter-spacing:.01em;display:block}
.bt small{display:block;font-family:var(--font-body);font-weight:600;color:var(--blue-2);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
.bt b{font-size:15px}

/* variables and layout for the shared header and footer */
:root{
  --blue:#007EC6;--blue-2:#0567A1;--blue-3:#064B73;--ink-head:#06324C;--blue-050:#E6F3FB;
  --ink:#24272A;--muted:#71777C;--hair:#DCE2E6;--grey:#9D9D9C;
  --teal:#0FB5A5;--coral:#FF6A5A;--gold:#F5B83D;--ok:#1EA672;--error:#FF6A5A;
  --page:#F6F8F9;--card:#FFFFFF;
  --font-head:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --radius-card:22px;--radius-btn:999px;
}
.hplus-wrap{max-width:820px;margin:0 auto}
.hplus-wrap{max-width:100%}
.hplus-root{padding:16px 16px 0;font-family:var(--font-body)}

/* align the shared header and footer with the document card */
.hplus-root > .hplus-wrap{max-width:880px;margin:0 auto}
/* header: brand on the left, language pill and the two buttons on the right */
.uhp-header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:12px;margin-bottom:14px}
.uhp-header-right{display:flex;align-items:center;gap:12px;margin-left:auto}
.uhp-header .langswitch{margin:0;justify-content:flex-end}
.uhp-header .langswitch .seg,.uhp-header .langswitch{border-radius:999px}
.uhp-header .langswitch button{padding:7px 15px;font-size:12.5px}
@media(max-width:767px){
  .uhp-header{gap:10px}
  .uhp-header-right{gap:8px;width:100%;justify-content:flex-end}
}

/* language pill in the header */
.uhp-header .langswitch{display:flex;justify-content:flex-end;margin:0;position:relative;z-index:40}
.uhp-header .langswitch .seg{display:inline-flex;background:#fff;border:1px solid var(--hair);border-radius:999px;overflow:hidden;box-shadow:0 6px 16px -12px rgba(6,50,76,.35)}
.uhp-header .langswitch button{font-family:var(--font-head),inherit;font-size:12.5px;font-weight:600;border:none;background:transparent;color:var(--muted);padding:7px 15px;cursor:pointer;transition:.15s;letter-spacing:.03em;line-height:1.4}
.uhp-header .langswitch button.active{background:var(--blue);color:#fff}
</style>

var DOC = {"de": "<h1>Datenschutzerkl&auml;rung</h1>\n<h2>1. Datenschutz auf einen Blick</h2>\n<h3>Allgemeine Hinweise</h3>\n<p>Die folgenden Hinweise geben einen einfachen &Uuml;berblick dar&uuml;ber, was mit Ihren personenbezogenen Daten passiert, wenn Sie diese Website besuchen. Personenbezogene Daten sind alle Daten, mit denen Sie pers&ouml;nlich identifiziert werden k&ouml;nnen. Ausf&uuml;hrliche Informationen zum Thema Datenschutz entnehmen Sie unserer unter diesem Text aufgef&uuml;hrten Datenschutzerkl&auml;rung.</p>\n<h3>Datenerfassung auf dieser Website</h3>\n<p><strong>Wer ist verantwortlich f&uuml;r die Datenerfassung auf dieser Website?</strong></p>\n<p>Die Datenverarbeitung auf dieser Website erfolgt durch den Websitebetreiber. Dessen Kontaktdaten k&ouml;nnen Sie dem Impressum dieser Website entnehmen.</p>\n<p><strong>Wie erfassen wir Ihre Daten?</strong></p>\n<p>Ihre Daten werden zum einen dadurch erhoben, dass Sie uns diese mitteilen. Hierbei kann es sich z.&nbsp;B. um Daten handeln, die Sie in ein Kontaktformular eingeben.</p>\n<p>Andere Daten werden automatisch beim Besuch der Website durch unsere IT-Systeme erfasst. Das sind vor allem technische Daten (z.&nbsp;B. Internetbrowser, Betriebssystem oder Uhrzeit des Seitenaufrufs). Die Erfassung dieser Daten erfolgt automatisch, sobald Sie diese Website betreten.</p>\n<p><strong>Wof&uuml;r nutzen wir Ihre Daten?</strong></p>\n<p>Ein Teil der Daten wird erhoben, um eine fehlerfreie Bereitstellung der Website zu gew&auml;hrleisten. Andere Daten k&ouml;nnen zur Analyse Ihres Nutzerverhaltens verwendet werden.</p>\n<p><strong>Welche Rechte haben Sie bez&uuml;glich Ihrer Daten?</strong></p>\n<p>Sie haben jederzeit das Recht unentgeltlich Auskunft &uuml;ber Herkunft, Empf&auml;nger und Zweck Ihrer gespeicherten personenbezogenen Daten zu erhalten. Sie haben au&szlig;erdem ein Recht, die Berichtigung oder L&ouml;schung dieser Daten zu verlangen. Hierzu sowie zu weiteren Fragen zum Thema Datenschutz k&ouml;nnen Sie sich jederzeit unter der im Impressum angegebenen Adresse an uns wenden. Des Weiteren steht Ihnen ein Beschwerderecht bei der zust&auml;ndigen Aufsichtsbeh&ouml;rde zu.</p>\n<p>Au&szlig;erdem haben Sie das Recht, unter bestimmten Umst&auml;nden die Einschr&auml;nkung der Verarbeitung Ihrer personenbezogenen Daten zu verlangen. Details hierzu entnehmen Sie der Datenschutzerkl&auml;rung unter &bdquo;Recht auf Einschr&auml;nkung der Verarbeitung&ldquo;.</p>\n<h3>Analyse-Tools und Tools von Drittanbietern</h3>\n<p>Beim Besuch dieser Website kann Ihr Surf-Verhalten statistisch ausgewertet werden. Das geschieht vor allem mit Cookies und mit sogenannten Analyseprogrammen. Die Analyse Ihres Surf-Verhaltens erfolgt in der Regel anonym; das Surf-Verhalten kann nicht zu Ihnen zur&uuml;ckverfolgt werden.</p>\n<p>Sie k&ouml;nnen dieser Analyse widersprechen oder sie durch die Nichtbenutzung bestimmter Tools verhindern. Detaillierte Informationen zu diesen Tools und &uuml;ber Ihre Widerspruchsm&ouml;glichkeiten finden Sie in der folgenden Datenschutzerkl&auml;rung.</p>\n<h2>2. Hosting und Content Delivery Networks (CDN)</h2>\n<h3>Externes Hosting</h3>\n<p>Diese Website wird bei einem externen Dienstleister gehostet (Hoster). Die personenbezogenen Daten, die auf dieser Website erfasst werden, werden auf den Servern des Hosters gespeichert. Hierbei kann es sich v. a. um IP-Adressen, Kontaktanfragen, Meta- und Kommunikationsdaten, Vertragsdaten, Kontaktdaten, Namen, Webseitenzugriffe und sonstige Daten, die &uuml;ber eine Website generiert werden, handeln.</p>\n<p>Der Einsatz des Hosters erfolgt zum Zwecke der Vertragserf&uuml;llung gegen&uuml;ber unseren potenziellen und bestehenden Kunden (Art. 6 Abs. 1 lit. b DSGVO) und im Interesse einer sicheren, schnellen und effizienten Bereitstellung unseres Online-Angebots durch einen professionellen Anbieter (Art. 6 Abs. 1 lit. f DSGVO).</p>\n<p>Unser Hoster wird Ihre Daten nur insoweit verarbeiten, wie dies zur Erf&uuml;llung seiner Leistungspflichten erforderlich ist und unsere Weisungen in Bezug auf diese Daten befolgen.</p>\n<p><strong>Abschluss eines Vertrages &uuml;ber Auftragsverarbeitung</strong></p>\n<p>Um die datenschutzkonforme Verarbeitung zu gew&auml;hrleisten, haben wir einen Vertrag &uuml;ber Auftragsverarbeitung mit unserem Hoster geschlossen.</p>\n<h2>3. Allgemeine Hinweise und Pflichtinformationen</h2>\n<h3>Datenschutz</h3>\n<p>Die Betreiber dieser Seiten nehmen den Schutz Ihrer pers&ouml;nlichen Daten sehr ernst. Wir behandeln Ihre personenbezogenen Daten vertraulich und entsprechend der gesetzlichen Datenschutzvorschriften sowie dieser Datenschutzerkl&auml;rung.</p>\n<p>Wenn Sie diese Website benutzen, werden verschiedene personenbezogene Daten erhoben. Personenbezogene Daten sind Daten, mit denen Sie pers&ouml;nlich identifiziert werden k&ouml;nnen. Die vorliegende Datenschutzerkl&auml;rung erl&auml;utert, welche Daten wir erheben und wof&uuml;r wir sie nutzen. Sie erl&auml;utert auch, wie und zu welchem Zweck das geschieht.</p>\n<p>Wir weisen darauf hin, dass die Daten&uuml;bertragung im Internet (z.&nbsp;B. bei der Kommunikation per E-Mail) Sicherheitsl&uuml;cken aufweisen kann. Ein l&uuml;ckenloser Schutz der Daten vor dem Zugriff durch Dritte ist nicht m&ouml;glich.</p>\n<h3>Hinweis zur verantwortlichen Stelle</h3>\n<p>Die verantwortliche Stelle f&uuml;r die Datenverarbeitung auf dieser Website ist:</p>\n<p>Healthcare Deutschland GmbH<br />\nBergstra&szlig;e 31<br />\n69469 Weinheim</p>\n<p>Telefon: +49 (0) 800 44 020 44<br />\nE-Mail: info@united-healthcare.eu</p>\n<p>Verantwortliche Stelle ist die nat&uuml;rliche oder juristische Person, die allein oder gemeinsam mit anderen &uuml;ber die Zwecke und Mittel der Verarbeitung von personenbezogenen Daten (z.&nbsp;B. Namen, E-Mail-Adressen o. &Auml;.) entscheidet.</p>\n<h3>Gesetzlich vorgeschriebener Datenschutzbeauftragter</h3>\n<p>Wir haben f&uuml;r unser Unternehmen einen Datenschutzbeauftragten bestellt.</p>\n<p>Daniel Schaupp<br />\nDeltaMed S&uuml;d<br />\nUntere Gasse 9<br />\n71642 Ludwigsburg</p>\n<p>Telefon: 07141 - 974 57 15<br />\nE-Mail: daniel.schaupp@deltamedsued.de</p>\n<h3>Widerruf Ihrer Einwilligung zur Datenverarbeitung</h3>\n<p>Viele Datenverarbeitungsvorg&auml;nge sind nur mit Ihrer ausdr&uuml;cklichen Einwilligung m&ouml;glich. Sie k&ouml;nnen eine bereits erteilte Einwilligung jederzeit widerrufen. Dazu reicht eine formlose Mitteilung per E-Mail an uns. Die Rechtm&auml;&szlig;igkeit der bis zum Widerruf erfolgten Datenverarbeitung bleibt vom Widerruf unber&uuml;hrt.</p>\n<h3>Widerspruchsrecht gegen die Datenerhebung in besonderen F&auml;llen sowie gegen Direktwerbung (Art. 21 DSGVO)</h3>\n<p>WENN DIE DATENVERARBEITUNG AUF GRUNDLAGE VON ART. 6 ABS. 1 LIT. E ODER F DSGVO ERFOLGT, HABEN SIE JEDERZEIT DAS RECHT, AUS GR&Uuml;NDEN, DIE SICH AUS IHRER BESONDEREN SITUATION ERGEBEN, GEGEN DIE VERARBEITUNG IHRER PERSONENBEZOGENEN DATEN WIDERSPRUCH EINZULEGEN; DIES GILT AUCH F&Uuml;R EIN AUF DIESE BESTIMMUNGEN GEST&Uuml;TZTES PROFILING. DIE JEWEILIGE RECHTSGRUNDLAGE, AUF DENEN EINE VERARBEITUNG BERUHT, ENTNEHMEN SIE DIESER DATENSCHUTZERKL&Auml;RUNG. WENN SIE WIDERSPRUCH EINLEGEN, WERDEN WIR IHRE BETROFFENEN PERSONENBEZOGENEN DATEN NICHT MEHR VERARBEITEN, ES SEI DENN, WIR K&Ouml;NNEN ZWINGENDE SCHUTZW&Uuml;RDIGE GR&Uuml;NDE F&Uuml;R DIE VERARBEITUNG NACHWEISEN, DIE IHRE INTERESSEN, RECHTE UND FREIHEITEN &Uuml;BERWIEGEN ODER DIE VERARBEITUNG DIENT DER GELTENDMACHUNG, AUS&Uuml;BUNG ODER VERTEIDIGUNG VON RECHTSANSPR&Uuml;CHEN (WIDERSPRUCH NACH ART. 21 ABS. 1 DSGVO).</p>\n<p>WERDEN IHRE PERSONENBEZOGENEN DATEN VERARBEITET, UM DIREKTWERBUNG ZU BETREIBEN, SO HABEN SIE DAS RECHT, JEDERZEIT WIDERSPRUCH GEGEN DIE VERARBEITUNG SIE BETREFFENDER PERSONENBEZOGENER DATEN ZUM ZWECKE DERARTIGER WERBUNG EINZULEGEN; DIES GILT AUCH F&Uuml;R DAS PROFILING, SOWEIT ES MIT SOLCHER DIREKTWERBUNG IN VERBINDUNG STEHT. WENN SIE WIDERSPRECHEN, WERDEN IHRE PERSONENBEZOGENEN DATEN ANSCHLIESSEND NICHT MEHR ZUM ZWECKE DER DIREKTWERBUNG VERWENDET (WIDERSPRUCH NACH ART. 21 ABS. 2 DSGVO).</p>\n<h3>Beschwerderecht bei der zust&auml;ndigen Aufsichtsbeh&ouml;rde</h3>\n<p>Im Falle von Verst&ouml;&szlig;en gegen die DSGVO steht den Betroffenen ein Beschwerderecht bei einer Aufsichtsbeh&ouml;rde, insbesondere in dem Mitgliedstaat ihres gew&ouml;hnlichen Aufenthalts, ihres Arbeitsplatzes oder des Orts des mutma&szlig;lichen Versto&szlig;es zu. Das Beschwerderecht besteht unbeschadet anderweitiger verwaltungsrechtlicher oder gerichtlicher Rechtsbehelfe.</p>\n<h3>Recht auf Daten&uuml;bertragbarkeit</h3>\n<p>Sie haben das Recht, Daten, die wir auf Grundlage Ihrer Einwilligung oder in Erf&uuml;llung eines Vertrags automatisiert verarbeiten, an sich oder an einen Dritten in einem g&auml;ngigen, maschinenlesbaren Format aush&auml;ndigen zu lassen. Sofern Sie die direkte &Uuml;bertragung der Daten an einen anderen Verantwortlichen verlangen, erfolgt dies nur, soweit es technisch machbar ist.</p>\n<h3>SSL- bzw. TLS-Verschl&uuml;sselung</h3>\n<p>Diese Seite nutzt aus Sicherheitsgr&uuml;nden und zum Schutz der &Uuml;bertragung vertraulicher Inhalte, wie zum Beispiel Bestellungen oder Anfragen, die Sie an uns als Seitenbetreiber senden, eine SSL- bzw. TLS-Verschl&uuml;sselung. Eine verschl&uuml;sselte Verbindung erkennen Sie daran, dass die Adresszeile des Browsers von &bdquo;http://&ldquo; auf &bdquo;https://&ldquo; wechselt und an dem Schloss-Symbol in Ihrer Browserzeile.</p>\n<p>Wenn die SSL- bzw. TLS-Verschl&uuml;sselung aktiviert ist, k&ouml;nnen die Daten, die Sie an uns &uuml;bermitteln, nicht von Dritten mitgelesen werden.</p>\n<h3>Auskunft, L&ouml;schung und Berichtigung</h3>\n<p>Sie haben im Rahmen der geltenden gesetzlichen Bestimmungen jederzeit das Recht auf unentgeltliche Auskunft &uuml;ber Ihre gespeicherten personenbezogenen Daten, deren Herkunft und Empf&auml;nger und den Zweck der Datenverarbeitung und ggf. ein Recht auf Berichtigung oder L&ouml;schung dieser Daten. Hierzu sowie zu weiteren Fragen zum Thema personenbezogene Daten k&ouml;nnen Sie sich jederzeit unter der im Impressum angegebenen Adresse an uns wenden.</p>\n<h3>Recht auf Einschr&auml;nkung der Verarbeitung</h3>\n<p>Sie haben das Recht, die Einschr&auml;nkung der Verarbeitung Ihrer personenbezogenen Daten zu verlangen. Hierzu k&ouml;nnen Sie sich jederzeit unter der im Impressum angegebenen Adresse an uns wenden. Das Recht auf Einschr&auml;nkung der Verarbeitung besteht in folgenden F&auml;llen:</p>\n<ul>\n\t<li>Wenn Sie die Richtigkeit Ihrer bei uns gespeicherten personenbezogenen Daten bestreiten, ben&ouml;tigen wir in der Regel Zeit, um dies zu &uuml;berpr&uuml;fen. F&uuml;r die Dauer der Pr&uuml;fung haben Sie das Recht, die Einschr&auml;nkung der Verarbeitung Ihrer personenbezogenen Daten zu verlangen.</li>\n\t<li>Wenn die Verarbeitung Ihrer personenbezogenen Daten unrechtm&auml;&szlig;ig geschah/geschieht, k&ouml;nnen Sie statt der L&ouml;schung die Einschr&auml;nkung der Datenverarbeitung verlangen.</li>\n\t<li>Wenn wir Ihre personenbezogenen Daten nicht mehr ben&ouml;tigen, Sie sie jedoch zur Aus&uuml;bung, Verteidigung oder Geltendmachung von Rechtsanspr&uuml;chen ben&ouml;tigen, haben Sie das Recht, statt der L&ouml;schung die Einschr&auml;nkung der Verarbeitung Ihrer personenbezogenen Daten zu verlangen.</li>\n\t<li>Wenn Sie einen Widerspruch nach Art. 21 Abs. 1 DSGVO eingelegt haben, muss eine Abw&auml;gung zwischen Ihren und unseren Interessen vorgenommen werden. Solange noch nicht feststeht, wessen Interessen &uuml;berwiegen, haben Sie das Recht, die Einschr&auml;nkung der Verarbeitung Ihrer personenbezogenen Daten zu verlangen.</li>\n</ul>\n<p>Wenn Sie die Verarbeitung Ihrer personenbezogenen Daten eingeschr&auml;nkt haben, d&uuml;rfen diese Daten &ndash; von ihrer Speicherung abgesehen &ndash; nur mit Ihrer Einwilligung oder zur Geltendmachung, Aus&uuml;bung oder Verteidigung von Rechtsanspr&uuml;chen oder zum Schutz der Rechte einer anderen nat&uuml;rlichen oder juristischen Person oder aus Gr&uuml;nden eines wichtigen &ouml;ffentlichen Interesses der Europ&auml;ischen Union oder eines Mitgliedstaats verarbeitet werden.</p>\n<h2>4. Datenerfassung auf dieser Website</h2>\n<h3>Cookies</h3>\n<p>Unsere Internetseiten verwenden so genannte &bdquo;Cookies&ldquo;. Cookies sind kleine Textdateien und richten auf Ihrem Endger&auml;t keinen Schaden an. Sie werden entweder vor&uuml;bergehend f&uuml;r die Dauer einer Sitzung (Session-Cookies) oder dauerhaft (permanente Cookies) auf Ihrem Endger&auml;t gespeichert. Session-Cookies werden nach Ende Ihres Besuchs automatisch gel&ouml;scht. Permanente Cookies bleiben auf Ihrem Endger&auml;t gespeichert bis Sie diese selbst l&ouml;schen&nbsp;oder eine automatische L&ouml;sung durch Ihren Webbrowser erfolgt.</p>\n<p>Teilweise k&ouml;nnen auch Cookies von Drittunternehmen auf Ihrem Endger&auml;t gespeichert werden, wenn Sie unsere Seite betreten (Third-Party-Cookies). Diese erm&ouml;glichen uns oder Ihnen die Nutzung bestimmter Dienstleistungen des Drittunternehmens (z.B. Cookies zur Abwicklung von Zahlungsdienstleistungen).</p>\n<p>Cookies haben verschiedene Funktionen. Zahlreiche Cookies sind technisch notwendig, da bestimmte Webseitenfunktionen ohne diese nicht funktionieren w&uuml;rden (z.B. die Warenkorbfunktion oder die Anzeige von Videos). Andere Cookies dienen dazu das Nutzerverhalten auszuwerten&nbsp;oder Werbung anzuzeigen.</p>\n<p>Cookies, die zur Durchf&uuml;hrung des elektronischen Kommunikationsvorgangs oder zur Bereitstellung bestimmter, von Ihnen erw&uuml;nschter Funktionen (z. B. Warenkorbfunktion) erforderlich sind, werden auf Grundlage von Art. 6 Abs. 1 lit. f DSGVO gespeichert. Der Websitebetreiber hat ein berechtigtes Interesse an der Speicherung von Cookies zur technisch fehlerfreien und optimierten Bereitstellung seiner Dienste. Sofern eine entsprechende Einwilligung abgefragt wurde (z. B. eine Einwilligung zur Speicherung von Cookies), erfolgt die Verarbeitung ausschlie&szlig;lich auf Grundlage von Art. 6 Abs. 1 lit. a DSGVO; die Einwilligung ist jederzeit widerrufbar.</p>\n<p>Sie k&ouml;nnen Ihren Browser so einstellen, dass Sie &uuml;ber das Setzen von Cookies informiert werden und Cookies nur im Einzelfall erlauben, die Annahme von Cookies f&uuml;r bestimmte F&auml;lle oder generell ausschlie&szlig;en sowie das automatische L&ouml;schen der Cookies beim Schlie&szlig;en des Browsers aktivieren. Bei der Deaktivierung von Cookies kann die Funktionalit&auml;t dieser Website eingeschr&auml;nkt sein.</p>\n<p>Soweit Cookies von Drittunternehmen oder zu Analysezwecken eingesetzt werden, werden wir Sie hier&uuml;ber im Rahmen dieser Datenschutzerkl&auml;rung gesondert informieren und ggf. eine Einwilligung abfragen.</p>\n<p><a href=\"#\" onclick=\"CookieFirst.withdrawConsent();\">Hier klicken um die Cookie-Einwilligung zu widerrufen</a></p>\n&nbsp;\n<h3>Kontaktformular</h3>\n<p>Wenn Sie uns per Kontaktformular Anfragen zukommen lassen, werden Ihre Angaben aus dem Anfrageformular inklusive der von Ihnen dort angegebenen Kontaktdaten zwecks Bearbeitung der Anfrage und f&uuml;r den Fall von Anschlussfragen bei uns gespeichert. Diese Daten geben wir nicht ohne Ihre Einwilligung weiter.</p>\n<p>Die Verarbeitung dieser Daten erfolgt auf Grundlage von Art. 6 Abs. 1 lit. b DSGVO, sofern Ihre Anfrage mit der Erf&uuml;llung eines Vertrags zusammenh&auml;ngt oder zur Durchf&uuml;hrung vorvertraglicher Ma&szlig;nahmen erforderlich ist. In allen &uuml;brigen F&auml;llen beruht die Verarbeitung auf unserem berechtigten Interesse an der effektiven Bearbeitung der an uns gerichteten Anfragen (Art. 6 Abs. 1 lit. f DSGVO) oder auf Ihrer Einwilligung (Art. 6 Abs. 1 lit. a DSGVO) sofern diese abgefragt wurde.</p>\n<p>Die von Ihnen im Kontaktformular eingegebenen Daten verbleiben bei uns, bis Sie uns zur L&ouml;schung auffordern, Ihre Einwilligung zur Speicherung widerrufen oder der Zweck f&uuml;r die Datenspeicherung entf&auml;llt (z.&nbsp;B. nach abgeschlossener Bearbeitung Ihrer Anfrage). Zwingende gesetzliche Bestimmungen &ndash; insbesondere Aufbewahrungsfristen &ndash; bleiben unber&uuml;hrt.</p>\n<h3>Anfrage per E-Mail, Telefon oder Telefax</h3>\n<p>Wenn Sie uns per E-Mail, Telefon oder Telefax kontaktieren, wird Ihre Anfrage inklusive aller daraus hervorgehenden personenbezogenen Daten (Name, Anfrage) zum Zwecke der Bearbeitung Ihres Anliegens bei uns gespeichert und verarbeitet. Diese Daten geben wir nicht ohne Ihre Einwilligung weiter.</p>\n<p>Die Verarbeitung dieser Daten erfolgt auf Grundlage von Art. 6 Abs. 1 lit. b DSGVO, sofern Ihre Anfrage mit der Erf&uuml;llung eines Vertrags zusammenh&auml;ngt oder zur Durchf&uuml;hrung vorvertraglicher Ma&szlig;nahmen erforderlich ist. In allen &uuml;brigen F&auml;llen beruht die Verarbeitung auf Ihrer Einwilligung (Art. 6 Abs. 1 lit. a DSGVO) und/oder auf unseren berechtigten Interessen (Art. 6 Abs. 1 lit. f DSGVO), da wir ein berechtigtes Interesse an der effektiven Bearbeitung der an uns gerichteten Anfragen haben.</p>\n<p>Die von Ihnen an uns per Kontaktanfragen &uuml;bersandten Daten verbleiben bei uns, bis Sie uns zur L&ouml;schung auffordern, Ihre Einwilligung zur Speicherung widerrufen oder der Zweck f&uuml;r die Datenspeicherung entf&auml;llt (z.&nbsp;B. nach abgeschlossener Bearbeitung Ihres Anliegens). Zwingende gesetzliche Bestimmungen &ndash; insbesondere gesetzliche Aufbewahrungsfristen &ndash; bleiben unber&uuml;hrt.</p>\n<h2>5. Analyse-Tools und Werbung</h2>\n<h3>Google Analytics</h3>\n<p>Diese Website nutzt Funktionen des Webanalysedienstes Google Analytics. Anbieter ist die Google Ireland Limited (&bdquo;Google&ldquo;), Gordon House, Barrow Street, Dublin 4, Irland.</p>\n<p>Google Analytics verwendet so genannte &bdquo;Cookies&ldquo;. Das sind Textdateien, die auf Ihrem Computer gespeichert werden und die eine Analyse der Benutzung der Website durch Sie erm&ouml;glichen. Die durch den Cookie erzeugten Informationen &uuml;ber Ihre Ben ie Erfassung der durch den Cookie erzeugten und auf Ihre Nutzung der Website bezogenen Daten (inkl. Ihrer IP-Adresse) an Google sowie die Verarbeitung dieser Daten durch Google verhindern, indem Sie das unter dem folgenden Link verf&uuml;gbare Browser-Plugin herunterladen und installieren: <a href=\"https://tools.google.com/dlpage/gaoptout?hl=de\" rel=\"noopener noreferrer\" target=\"_blank\">https://tools.google.com/dlpage/gaoptout?hl=de</a>.</p>\n<p><strong>Widerspruch gegen Datenerfassung</strong></p>\n<p>Sie k&ouml;nnen die Erfassung Ihrer Daten durch Google Analytics verhindern, indem Sie auf folgenden Link klicken. Es wird ein Opt-Out-Cookie gesetzt, der die Erfassung Ihrer Daten bei zuk&uuml;nftigen Besuchen dieser Website verhindert: <a href=\"javascript:gaOptout();\">Google Analytics deaktivieren</a>.</p>\n<p>Mehr Informationen zum Umgang mit Nutzerdaten bei Google Analytics finden Sie in der Datenschutzerkl&auml;rung von Google: <a href=\"https://support.google.com/analytics/answer/6004245?hl=de\" rel=\"noopener noreferrer\" target=\"_blank\">https://support.google.com/analytics/answer/6004245?hl=de</a>.</p>\n<p><strong>Auftragsverarbeitung</strong></p>\n<p>Wir haben mit Google einen Vertrag zur Auftragsverarbeitung abgeschlossen und setzen die strengen Vorgaben der deutschen Datenschutzbeh&ouml;rden bei der Nutzung von Google Analytics vollst&auml;ndig um.</p>\n<p><strong>Speicherdauer</strong></p>\n<p>Bei Google gespeicherte Daten auf Nutzer- und Ereignisebene, die mit Cookies, Nutzerkennungen (z.&nbsp;B. User ID) oder Werbe-IDs (z.&nbsp;B. DoubleClick-Cookies, Android-Werbe-ID) verkn&uuml;pft sind, werden nach 14 Monaten anonymisiert bzw. gel&ouml;scht. Details hierzu ersehen Sie unter folgendem Link: <a href=\"https://support.google.com/analytics/answer/7667196?hl=de\" rel=\"noopener noreferrer\" target=\"_blank\">https://support.google.com/analytics/answer/7667196?hl=de</a></p>\n<h3>Hotjar</h3>\n<p>Diese Website nutzt Hotjar. Anbieter ist die Hotjar Ltd., Level 2, St Julians Business Centre, 3, Elia Zammit Street, St Julians STJ 1000, Malta, Europe (Website: <a href=\"\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.hotjar.com</a>).</p>\n<p>Hotjar ist ein Werkzeug zur Analyse Ihres Nutzerverhaltens auf dieser Website. Mit Hotjar k&ouml;nnen wir u. a. Ihre Maus- und Scrollbewegungen und Klicks aufzeichnen. Hotjar kann dabei auch feststellen, wie lange Sie mit dem Mauszeiger auf einer bestimmten Stelle verblieben sind. Aus diesen Informationen erstellt Hotjar sogenannte Heatmaps, mit denen sich feststellen l&auml;sst, welche Websitebereiche vom Websitebesucher bevorzugt angeschaut werden.</p>\n<p>Des Weiteren k&ouml;nnen wir feststellen, wie lange Sie auf einer Seite verblieben sind und wann Sie sie verlassen haben. Wir k&ouml;nnen auch feststellen, an welcher Stelle Sie Ihre Eingaben in ein Kontaktformular abgebrochen haben (sog. Conversion-Funnels).</p>\n<p>Dar&uuml;ber hinaus k&ouml;nnen mit Hotjar direkte Feedbacks von Websitebesuchern eingeholt werden. Diese Funktion dient der Verbesserung der Webangebote des Websitebetreibers.</p>\n<p>Hotjar verwendet Cookies. Cookies sind kleine Textdateien, die auf Ihrem Rechner abgelegt werden und die Ihr Browser speichert. Sie dienen dazu, unser Angebot nutzerfreundlicher, effektiver und sicherer zu machen. Mit diesen Cookies l&auml;sst sich insbesondere feststellen, ob diese Website mit einem bestimmten Endger&auml;t besucht wurde oder ob die Funktionen von Hotjar f&uuml;r den betreffenden Browser deaktiviert wurden. Hotjar-Cookies verbleiben auf Ihrem Endger&auml;t, bis Sie sie l&ouml;schen.</p>\n<p>Sie k&ouml;nnen Ihren Browser so einstellen, dass Sie &uuml;ber das Setzen von Cookies informiert werden und Cookies nur im Einzelfall erlauben, die Annahme von Cookies f&uuml;r bestimmte F&auml;lle oder generell ausschlie&szlig;en sowie das automatische L&ouml;schen der Cookies beim Schlie&szlig;en des Browsers aktivieren. Bei der Deaktivierung von Cookies kann die Funktionalit&auml;t dieser Website eingeschr&auml;nkt sein.</p>\n<p>Die Nutzung von Hotjar und die Speicherung von Hotjar-Cookies erfolgen auf Grundlage von Art. 6 Abs. 1 lit. f DSGVO. Der Websitebetreiber hat ein berechtigtes Interesse an der Analyse des Nutzerverhaltens, um sowohl sein Webangebot als auch seine Werbung zu optimieren. Sofern eine entsprechende Einwilligung abgefragt wurde (z. B. eine Einwilligung zur Speicherung von Cookies), erfolgt die Verarbeitung ausschlie&szlig;lich auf Grundlage von Art. 6 Abs. 1 lit. a DSGVO; die Einwilligung ist jederzeit widerrufbar.</p>\n<p><strong>Deaktivieren von Hotjar</strong></p>\n<p>Wenn Sie die Datenerfassung durch Hotjar deaktivieren m&ouml;chten, klicken Sie auf folgenden Link und folgen Sie den dortigen Anweisungen: <a href=\"https://www.hotjar.com/opt-out\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.hotjar.com/opt-out</a></p>\n<p>Bitte beachten Sie, dass die Deaktivierung von Hotjar f&uuml;r jeden Browser bzw. f&uuml;r jedes Endger&auml;t separat erfolgen muss.</p>\n<p>N&auml;here Informationen &uuml;ber Hotjar und zu den erfassten Daten entnehmen Sie der Datenschutzerkl&auml;rung von Hotjar unter dem folgenden Link: <a href=\"https://www.hotjar.com/privacy\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.hotjar.com/privacy</a></p>\n<h2>6. Newsletter</h2>\n<h3>Newsletterdaten</h3>\n<p>Wenn Sie den auf der Website angebotenen Newsletter beziehen m&ouml;chten, ben&ouml;tigen wir von Ihnen eine E-Mail-Adresse sowie Informationen, welche uns die &Uuml;berpr&uuml;fung gestatten, dass Sie der Inhaber der angegebenen E-Mail-Adresse sind und mit dem Empfang des Newsletters einverstanden sind. Weitere Daten werden nicht bzw. nur auf freiwilliger Basis erhoben. Diese Daten verwenden wir ausschlie&szlig;lich f&uuml;r den Versand der angeforderten Informationen und geben diese nicht an Dritte weiter.</p>\n<p>Die Verarbeitung der in das Newsletteranmeldeformular eingegebenen Daten erfolgt ausschlie&szlig;lich auf Grundlage Ihrer Einwilligung (Art. 6 Abs. 1 lit. a DSGVO). Die erteilte Einwilligung zur Speicherung der Daten, der E-Mail-Adresse sowie deren Nutzung zum Versand des Newsletters k&ouml;nnen Sie jederzeit widerrufen, etwa &uuml;ber den &bdquo;Austragen&ldquo;-Link im Newsletter. Die Rechtm&auml;&szlig;igkeit der bereits erfolgten Datenverarbeitungsvorg&auml;nge bleibt vom Widerruf unber&uuml;hrt.</p>\n<p>Die von Ihnen zum Zwecke des Newsletter-Bezugs bei uns hinterlegten Daten werden von uns bis zu Ihrer Austragung aus dem Newsletter bei uns bzw. dem Newsletterdiensteanbieter gespeichert und nach der Abbestellung des Newsletters aus der Newsletterverteilerliste gel&ouml;scht. Daten, die zu anderen Zwecken bei uns gespeichert wurden bleiben hiervon unber&uuml;hrt.</p>\n<p>Nach Ihrer Austragung aus der Newsletterverteilerliste wird Ihre E-Mail-Adresse bei uns bzw. dem Newsletterdiensteanbieter ggf. in einer Blacklist gespeichert, um k&uuml;nftige Mailings zu verhindern. Die Daten aus der Blacklist werden nur f&uuml;r diesen Zweck verwendet und nicht mit anderen Daten zusammengef&uuml;hrt. Dies dient sowohl Ihrem Interesse als auch unserem Interesse an der Einhaltung der gesetzlichen Vorgaben beim Versand von Newslettern (berechtigtes Interesse im Sinne des Art. 6 Abs. 1 lit. f DSGVO). Die Speicherung in der Blacklist ist zeitlich nicht befristet. <strong>Sie k&ouml;nnen der Speicherung widersprechen, sofern Ihre Interessen unser berechtigtes Interesse &uuml;berwiegen.</strong></p>\n<h2>7. Plugins und Tools</h2>\n<h3>Google Web Fonts</h3>\n<p>Diese Seite nutzt zur einheitlichen Darstellung von Schriftarten so genannte Web Fonts, die von Google bereitgestellt werden. Die Google Fonts sind lokal installiert. Eine Verbindung zu Servern von Google findet dabei nicht statt.</p>\n<p>Weitere Informationen zu Google Web Fonts finden Sie unter <a href=\"https://developers.google.com/fonts/faq\" rel=\"noopener noreferrer\" target=\"_blank\">https://developers.google.com/fonts/faq</a> und in der Datenschutzerkl&auml;rung von Google: <a href=\"https://policies.google.com/privacy?hl=de\" rel=\"noopener noreferrer\" target=\"_blank\">https://policies.google.com/privacy?hl=de</a>.</p>\n<h3>Google Maps</h3>\n<p>Diese Seite nutzt &uuml;ber eine API den Kartendienst Google Maps. Anbieter ist die Google Ireland Limited (&bdquo;Google&ldquo;), Gordon House, Barrow Street, Dublin 4, Irland.</p>\n<p>Zur Nutzung der Funktionen von Google Maps ist es notwendig, Ihre IP Adresse zu speichern. Diese Informationen werden in der Regel an einen Server von Google in den USA &uuml;bertragen und dort gespeichert. Der Anbieter dieser Seite hat keinen Einfluss auf diese Daten&uuml;bertragung.</p>\n<p>Die Nutzung von Google Maps erfolgt im Interesse einer ansprechenden Darstellung unserer Online-Angebote und an einer leichten Auffindbarkeit der von uns auf der Website angegebenen Orte. Dies stellt ein berechtigtes Interesse im Sinne von Art. 6 Abs. 1 lit. f DSGVO dar.</p>\n<p>Mehr Informationen zum Umgang mit Nutzerdaten finden Sie in der Datenschutzerkl&auml;rung von Google: <a href=\"https://policies.google.com/privacy?hl=de\" rel=\"noopener noreferrer\" target=\"_blank\">https://policies.google.com/privacy?hl=de</a>.</p>\n<h2>8. eCommerce und Zahlungsanbieter</h2>\n<h3>Verarbeiten von Daten (Kunden- und Vertragsdaten)</h3>\n<p>Wir erheben, verarbeiten und nutzen personenbezogene Daten nur, soweit sie f&uuml;r die Begr&uuml;ndung, inhaltliche Ausgestaltung oder &Auml;nderung des Rechtsverh&auml;ltnisses erforderlich sind (Bestandsdaten). Dies erfolgt auf Grundlage von Art. 6 Abs. 1 lit. b DSGVO, der die Verarbeitung von Daten zur Erf&uuml;llung eines Vertrags oder vorvertraglicher Ma&szlig;nahmen gestattet. Personenbezogene Daten &uuml;ber die Inanspruchnahme dieser Website (Nutzungsdaten) erheben, verarbeiten und nutzen wir nur, soweit dies erforderlich ist, um dem Nutzer die Inanspruchnahme des Dienstes zu erm&ouml;glichen oder abzurechnen.</p>\n<p>Die erhobenen Kundendaten werden nach Abschluss des Auftrags oder Beendigung der Gesch&auml;ftsbeziehung gel&ouml;scht. Gesetzliche Aufbewahrungsfristen bleiben unber&uuml;hrt.</p>\n<h2>9. Eigene Dienste</h2>\n<h3>Umgang mit Bewerberdaten</h3>\n<p>Wir bieten Ihnen die M&ouml;glichkeit, sich bei uns zu bewerben (z.&nbsp;B. per E-Mail, postalisch oder via Online-Bewerberformular). Im Folgenden informieren wir Sie &uuml;ber Umfang, Zweck und Verwendung Ihrer im Rahmen des Bewerbungsprozesses erhobenen personenbezogenen Daten. Wir versichern, dass die Erhebung, Verarbeitung und Nutzung Ihrer Daten in &Uuml;bereinstimmung mit geltendem Datenschutzrecht und allen weiteren gesetzlichen Bestimmungen erfolgt und Ihre Daten streng vertraulich behandelt werden.</p>\n<p><strong>Umfang und Zweck der Datenerhebung </strong></p>\n<p>Wenn Sie uns eine Bewerbung zukommen lassen, verarbeiten wir Ihre damit verbundenen personenbezogenen Daten (z.&nbsp;B. Kontakt- und Kommunikationsdaten, Bewerbungsunterlagen, Notizen im Rahmen von Bewerbungsgespr&auml;chen etc.), soweit dies zur Entscheidung &uuml;ber die Begr&uuml;ndung eines Besch&auml;ftigungsverh&auml;ltnisses erforderlich ist. Rechtsgrundlage hierf&uuml;r ist &sect; 26 BDSG-neu nach deutschem Recht (Anbahnung eines Besch&auml;ftigungsverh&auml;ltnisses), Art. 6 Abs. 1 lit. b DSGVO (allgemeine Vertragsanbahnung) und &ndash; sofern Sie eine Einwilligung erteilt haben &ndash; Art. 6 Abs. 1 lit. a DSGVO. Die Einwilligung ist jederzeit widerrufbar. Ihre personenbezogenen Daten werden innerhalb unseres Unternehmens ausschlie&szlig;lich an Personen weitergegeben, die an der Bearbeitung Ihrer Bewerbung beteiligt sind.</p>\n<p>Sofern die Bewerbung erfolgreich ist, werden die von Ihnen eingereichten Daten auf Grundlage von &sect; 26 BDSG-neu und Art. 6 Abs. 1 lit. b DSGVO zum Zwecke der Durchf&uuml;hrung des Besch&auml;ftigungsverh&auml;ltnisses in unseren Datenverarbeitungssystemen gespeichert.</p>\n<p><strong>Aufbewahrungsdauer der Daten</strong></p>\n<p>Sofern wir Ihnen kein Stellenangebot machen k&ouml;nnen, Sie ein Stellenangebot ablehnen oder Ihre Bewerbung zur&uuml;ckziehen, behalten wir uns das Recht vor, die von Ihnen &uuml;bermittelten Daten auf Grundlage unserer berechtigten Interessen (Art. 6 Abs. 1 lit. f DSGVO) bis zu 6 Monate ab der Beendigung des Bewerbungsverfahrens (Ablehnung oder Zur&uuml;ckziehung der Bewerbung) bei uns aufzubewahren. Anschlie&szlig;end werden die Daten gel&ouml;scht und die physischen Bewerbungsunterlagen vernichtet. Die Aufbewahrung dient insbesondere Nachweiszwecken im Falle eines Rechtsstreits. Sofern ersichtlich ist, dass die Daten nach Ablauf der 6-Monatsfrist erforderlich sein werden (z.B. aufgrund eines drohenden oder anh&auml;ngigen Rechtsstreits), findet eine L&ouml;schung erst statt, wenn der Zweck f&uuml;r die weitergehende Aufbewahrung entf&auml;llt.</p>\n<p>Eine l&auml;ngere Aufbewahrung kann au&szlig;erdem stattfinden, wenn Sie eine entsprechende Einwilligung (Art. 6 Abs. 1 lit. a DSGVO) erteilt haben oder wenn gesetzliche Aufbewahrungspflichten der L&ouml;schung entgegenstehen.</p>", "en": "<h1>Privacy Policy</h1>\n<h2>1. Data protection at a glance</h2>\n<h3>General information</h3>\n<p>The following notes provide a straightforward overview of what happens to your personal data when you visit this website. Personal data means any data by which you can be personally identified. Detailed information on data protection can be found in the privacy policy set out below this text.</p>\n<h3>Data collection on this website</h3>\n<p><strong>Who is responsible for the data collection on this website?</strong></p>\n<p>Data processing on this website is carried out by the website operator. You will find the operator&#x27;s contact details in the imprint of this website.</p>\n<p><strong>How do we collect your data?</strong></p>\n<p>Your data is collected in part because you provide it to us. This may be, for example, data you enter into a contact form.</p>\n<p>Other data is collected automatically by our IT systems when you visit the website. This is primarily technical data (for example the internet browser, operating system or the time the page was accessed). This data is collected automatically as soon as you enter this website.</p>\n<p><strong>What do we use your data for?</strong></p>\n<p>Part of the data is collected in order to ensure that the website is provided free of errors. Other data may be used to analyse your user behaviour.</p>\n<p><strong>What rights do you have regarding your data?</strong></p>\n<p>You have the right to obtain information about the origin, recipients and purpose of your stored personal data at any time and free of charge. You also have the right to request that this data be corrected or erased. You can contact us about this, and about any further questions on the subject of data protection, at any time at the address given in the imprint. You also have a right to lodge a complaint with the competent supervisory authority.</p>\n<p>You also have the right, in certain circumstances, to request that the processing of your personal data be restricted. Details can be found in this privacy policy under &bdquo;Right to restriction of processing&ldquo;.</p>\n<h3>Analytics tools and third-party tools</h3>\n<p>When you visit this website, your browsing behaviour may be evaluated statistically. This is done primarily with cookies and with so-called analytics programmes. The analysis of your browsing behaviour is generally anonymous; your browsing behaviour cannot be traced back to you.</p>\n<p>You can object to this analysis or prevent it by not using certain tools. Detailed information about these tools and about your options to object can be found in the privacy policy below.</p>\n<h2>2. Hosting and content delivery networks (CDN)</h2>\n<h3>External hosting</h3>\n<p>This website is hosted by an external service provider (host). The personal data collected on this website is stored on the host&#x27;s servers. This may primarily involve IP addresses, contact requests, metadata and communication data, contract data, contact details, names, website access data and other data generated via a website.</p>\n<p>The host is used for the purpose of fulfilling our contract with our potential and existing customers (Art. 6(1)(b) GDPR) and in the interest of the secure, fast and efficient provision of our online services by a professional provider (Art. 6(1)(f) GDPR).</p>\n<p>Our host will process your data only to the extent necessary to fulfil its performance obligations and will follow our instructions in relation to this data.</p>\n<p><strong>Conclusion of a data processing agreement</strong></p>\n<p>In order to ensure processing in compliance with data protection law, we have concluded a data processing agreement with our host.</p>\n<h2>3. General information and mandatory disclosures</h2>\n<h3>Data protection</h3>\n<p>The operators of these pages take the protection of your personal data very seriously. We treat your personal data confidentially and in accordance with the statutory data protection provisions and this privacy policy.</p>\n<p>When you use this website, various items of personal data are collected. Personal data means data by which you can be personally identified. This privacy policy explains what data we collect and what we use it for. It also explains how and for what purpose this happens.</p>\n<p>We point out that data transmission over the internet (for example when communicating by email) can have security gaps. Complete protection of data against access by third parties is not possible.</p>\n<h3>Notice concerning the controller</h3>\n<p>The controller responsible for data processing on this website is:</p>\n<p>Healthcare Deutschland GmbH<br />\nBergstra&szlig;e 31<br />\n69469 Weinheim</p>\n<p>Telephone: +49 (0) 800 44 020 44<br />\nEmail: info@united-healthcare.eu</p>\n<p>The controller is the natural or legal person who alone or jointly with others determines the purposes and means of the processing of personal data (for example names, email addresses or similar).</p>\n<h3>Statutory data protection officer</h3>\n<p>We have appointed a data protection officer for our company.</p>\n<p>Daniel Schaupp<br />\nDeltaMed S&uuml;d<br />\nUntere Gasse 9<br />\n71642 Ludwigsburg</p>\n<p>Telephone: 07141 - 974 57 15<br />\nEmail: daniel.schaupp@deltamedsued.de</p>\n<h3>Withdrawal of your consent to data processing</h3>\n<p>Many data processing operations are only possible with your express consent. You can withdraw consent you have already given at any time. An informal notification by email to us is sufficient. The lawfulness of the data processing carried out up to the withdrawal remains unaffected by the withdrawal.</p>\n<h3>Right to object to data collection in particular cases and to direct marketing (Art. 21 GDPR)</h3>\n<p>WHERE DATA PROCESSING IS CARRIED OUT ON THE BASIS OF ART. 6(1)(E) OR (F) GDPR, YOU HAVE THE RIGHT AT ANY TIME TO OBJECT, ON GROUNDS RELATING TO YOUR PARTICULAR SITUATION, TO THE PROCESSING OF YOUR PERSONAL DATA; THIS ALSO APPLIES TO PROFILING BASED ON THOSE PROVISIONS. THE RESPECTIVE LEGAL BASIS ON WHICH PROCESSING IS BASED CAN BE FOUND IN THIS PRIVACY POLICY. IF YOU OBJECT, WE WILL NO LONGER PROCESS THE PERSONAL DATA CONCERNED UNLESS WE CAN DEMONSTRATE COMPELLING LEGITIMATE GROUNDS FOR THE PROCESSING WHICH OVERRIDE YOUR INTERESTS, RIGHTS AND FREEDOMS, OR THE PROCESSING SERVES THE ESTABLISHMENT, EXERCISE OR DEFENCE OF LEGAL CLAIMS (OBJECTION UNDER ART. 21(1) GDPR).</p>\n<p>IF YOUR PERSONAL DATA IS PROCESSED FOR THE PURPOSES OF DIRECT MARKETING, YOU HAVE THE RIGHT TO OBJECT AT ANY TIME TO THE PROCESSING OF PERSONAL DATA CONCERNING YOU FOR SUCH MARKETING; THIS ALSO APPLIES TO PROFILING TO THE EXTENT THAT IT IS RELATED TO SUCH DIRECT MARKETING. IF YOU OBJECT, YOUR PERSONAL DATA WILL SUBSEQUENTLY NO LONGER BE USED FOR THE PURPOSES OF DIRECT MARKETING (OBJECTION UNDER ART. 21(2) GDPR).</p>\n<h3>Right to lodge a complaint with the competent supervisory authority</h3>\n<p>In the event of infringements of the GDPR, data subjects have a right to lodge a complaint with a supervisory authority, in particular in the Member State of their habitual residence, their place of work or the place of the alleged infringement. This right to lodge a complaint is without prejudice to any other administrative or judicial remedy.</p>\n<h3>Right to data portability</h3>\n<p>You have the right to have data that we process automatically on the basis of your consent or in performance of a contract handed over to you or to a third party in a common, machine-readable format. If you request the direct transfer of the data to another controller, this will only take place where it is technically feasible.</p>\n<h3>SSL and TLS encryption</h3>\n<p>For security reasons and to protect the transmission of confidential content, such as orders or enquiries that you send to us as the site operator, this site uses SSL or TLS encryption. You can recognise an encrypted connection by the fact that the browser&#x27;s address bar changes from &bdquo;http://&ldquo; to &bdquo;https://&ldquo; and by the padlock symbol in your browser bar.</p>\n<p>When SSL or TLS encryption is activated, the data you transmit to us cannot be read by third parties.</p>\n<h3>Information, erasure and rectification</h3>\n<p>Within the framework of the applicable statutory provisions, you have the right at any time to obtain free information about your stored personal data, its origin and recipients and the purpose of the data processing and, where applicable, a right to rectification or erasure of this data. You can contact us about this, and about any further questions on the subject of personal data, at any time at the address given in the imprint.</p>\n<h3>Right to restriction of processing</h3>\n<p>You have the right to request the restriction of the processing of your personal data. You can contact us about this at any time at the address given in the imprint. The right to restriction of processing applies in the following cases:</p>\n<ul>\n\t<li>If you contest the accuracy of the personal data we hold about you, we generally need time to verify this. For the duration of the verification, you have the right to request the restriction of the processing of your personal data.</li>\n\t<li>If the processing of your personal data was or is unlawful, you can request the restriction of the data processing instead of erasure.</li>\n\t<li>If we no longer need your personal data, but you need it to exercise, defend or establish legal claims, you have the right to request the restriction of the processing of your personal data instead of erasure.</li>\n\t<li>If you have lodged an objection under Art. 21(1) GDPR, a balance must be struck between your interests and ours. As long as it has not yet been determined whose interests prevail, you have the right to request the restriction of the processing of your personal data.</li>\n</ul>\n<p>If you have restricted the processing of your personal data, this data may &ndash; apart from being stored &ndash; only be processed with your consent or for the establishment, exercise or defence of legal claims or for the protection of the rights of another natural or legal person or for reasons of important public interest of the European Union or a Member State.</p>\n<h2>4. Data collection on this website</h2>\n<h3>Cookies</h3>\n<p>Our web pages use so-called &bdquo;cookies&ldquo;. Cookies are small text files and do not cause any damage to your device. They are stored on your device either temporarily for the duration of a session (session cookies) or permanently (permanent cookies). Session cookies are deleted automatically at the end of your visit. Permanent cookies remain stored on your device until you delete them yourself&nbsp;or until they are deleted automatically by your web browser.</p>\n<p>In some cases, cookies from third-party companies may also be stored on your device when you enter our site (third-party cookies). These enable us or you to use certain services of the third-party company (for example cookies for processing payment services).</p>\n<p>Cookies have various functions. Many cookies are technically necessary, because certain website functions would not work without them (for example the shopping basket function or the display of videos). Other cookies serve to evaluate user behaviour&nbsp;or to display advertising.</p>\n<p>Cookies that are necessary to carry out the electronic communication process or to provide certain functions you have requested (for example the shopping basket function) are stored on the basis of Art. 6(1)(f) GDPR. The website operator has a legitimate interest in storing cookies for the technically error-free and optimised provision of its services. Where a corresponding consent has been requested (for example consent to the storage of cookies), processing takes place exclusively on the basis of Art. 6(1)(a) GDPR; consent can be withdrawn at any time.</p>\n<p>You can set your browser so that you are informed about the setting of cookies and allow cookies only in individual cases, exclude the acceptance of cookies for certain cases or in general, and activate the automatic deletion of cookies when the browser is closed. If cookies are deactivated, the functionality of this website may be limited.</p>\n<p>Where cookies are used by third-party companies or for analytics purposes, we will inform you separately about this within this privacy policy and, where applicable, request your consent.</p>\n<p><a href=\"#\" onclick=\"CookieFirst.withdrawConsent();\">Click here to withdraw your cookie consent</a></p>\n&nbsp;\n<h3>Contact form</h3>\n<p>If you send us enquiries via the contact form, the details you provide in the enquiry form, including the contact details you enter there, will be stored by us for the purpose of processing the enquiry and in case of follow-up questions. We do not pass this data on without your consent.</p>\n<p>This data is processed on the basis of Art. 6(1)(b) GDPR where your enquiry is connected with the performance of a contract or is necessary to carry out pre-contractual measures. In all other cases, the processing is based on our legitimate interest in the effective handling of enquiries addressed to us (Art. 6(1)(f) GDPR) or on your consent (Art. 6(1)(a) GDPR) where this has been requested.</p>\n<p>The data you enter in the contact form remains with us until you ask us to delete it, withdraw your consent to its storage, or the purpose for storing the data no longer applies (for example once your enquiry has been dealt with). Mandatory statutory provisions &ndash; in particular retention periods &ndash; remain unaffected.</p>\n<h3>Enquiry by email, telephone or fax</h3>\n<p>If you contact us by email, telephone or fax, your enquiry including all resulting personal data (name, enquiry) will be stored and processed by us for the purpose of dealing with your request. We do not pass this data on without your consent.</p>\n<p>This data is processed on the basis of Art. 6(1)(b) GDPR where your enquiry is connected with the performance of a contract or is necessary to carry out pre-contractual measures. In all other cases, the processing is based on your consent (Art. 6(1)(a) GDPR) and/or on our legitimate interests (Art. 6(1)(f) GDPR), since we have a legitimate interest in the effective handling of enquiries addressed to us.</p>\n<p>The data you send to us via contact enquiries remains with us until you ask us to delete it, withdraw your consent to its storage, or the purpose for storing the data no longer applies (for example once your request has been dealt with). Mandatory statutory provisions &ndash; in particular statutory retention periods &ndash; remain unaffected.</p>\n<h2>5. Analytics tools and advertising</h2>\n<h3>Google Analytics</h3>\n<p>This website uses functions of the web analytics service Google Analytics. The provider is Google Ireland Limited (&bdquo;Google&ldquo;), Gordon House, Barrow Street, Dublin 4, Ireland.</p>\n<p>Google Analytics uses so-called &bdquo;cookies&ldquo;. These are text files that are stored on your computer and that enable an analysis of your use of the website. The information generated by the cookie about your use of this website is generally transmitted to a Google server in the USA and stored there.</p>\n<p>The storage of Google Analytics cookies and the use of this analytics tool take place on the basis of Art. 6(1)(f) GDPR. The website operator has a legitimate interest in analysing user behaviour in order to optimise both its website and its advertising. Where a corresponding consent has been requested (for example consent to the storage of cookies), processing takes place exclusively on the basis of Art. 6(1)(a) GDPR; consent can be withdrawn at any time.</p>\n<p><strong>IP anonymisation</strong></p>\n<p>We have activated the IP anonymisation function on this website. As a result, your IP address will be shortened by Google within Member States of the European Union or in other contracting states of the Agreement on the European Economic Area before being transmitted to the USA. Only in exceptional cases will the full IP address be transmitted to a Google server in the USA and shortened there. On behalf of the operator of this website, Google will use this information to evaluate your use of the website, to compile reports on website activity and to provide the website operator with further services connected with website use and internet use. The IP address transmitted by your browser within the scope of Google Analytics is not merged with other Google data.</p>\n<p><strong>Browser plugin</strong></p>\n<p>You can prevent the storage of cookies by adjusting your browser software accordingly; we point out, however, that in this case you may not be able to use all the functions of this website to their full extent. You can also prevent the collection of the data generated by the cookie and relating to your use of the website (including your IP address) by Google, as well as the processing of this data by Google, by downloading and installing the browser plugin available at the following link: <a href=\"https://tools.google.com/dlpage/gaoptout?hl=de\" rel=\"noopener noreferrer\" target=\"_blank\">https://tools.google.com/dlpage/gaoptout?hl=de</a>.</p>\n<p><strong>Objection to data collection</strong></p>\n<p>You can prevent the collection of your data by Google Analytics by clicking on the following link. An opt-out cookie will be set that prevents the collection of your data on future visits to this website: <a href=\"javascript:gaOptout();\">Deactivate Google Analytics</a>.</p>\n<p>You can find more information about how Google Analytics handles user data in Google&#x27;s privacy policy: <a href=\"https://support.google.com/analytics/answer/6004245?hl=de\" rel=\"noopener noreferrer\" target=\"_blank\">https://support.google.com/analytics/answer/6004245?hl=de</a>.</p>\n<p><strong>Data processing agreement</strong></p>\n<p>We have concluded a data processing agreement with Google and fully implement the strict requirements of the German data protection authorities when using Google Analytics.</p>\n<p><strong>Storage period</strong></p>\n<p>Data stored by Google at user and event level that is linked to cookies, user identifiers (for example user ID) or advertising IDs (for example DoubleClick cookies, Android advertising ID) is anonymised or deleted after 14 months. Details can be found at the following link: <a href=\"https://support.google.com/analytics/answer/7667196?hl=de\" rel=\"noopener noreferrer\" target=\"_blank\">https://support.google.com/analytics/answer/7667196?hl=de</a></p>\n<h3>Hotjar</h3>\n<p>This website uses Hotjar. The provider is Hotjar Ltd., Level 2, St Julians Business Centre, 3, Elia Zammit Street, St Julians STJ 1000, Malta, Europe (website: <a href=\"\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.hotjar.com</a>).</p>\n<p>Hotjar is a tool for analysing your user behaviour on this website. With Hotjar we can record, among other things, your mouse and scroll movements and clicks. Hotjar can also determine how long you kept the mouse pointer at a particular place. From this information Hotjar creates so-called heatmaps, which make it possible to determine which areas of the website visitors prefer to look at.</p>\n<p>We can also determine how long you stayed on a page and when you left it. We can also determine at what point you abandoned your entries in a contact form (so-called conversion funnels).</p>\n<p>In addition, Hotjar can be used to obtain direct feedback from website visitors. This function serves to improve the website operator&#x27;s online offering.</p>\n<p>Hotjar uses cookies. Cookies are small text files that are placed on your computer and stored by your browser. They serve to make our offering more user-friendly, effective and secure. These cookies make it possible in particular to determine whether this website has been visited with a particular device or whether the Hotjar functions have been deactivated for the browser concerned. Hotjar cookies remain on your device until you delete them.</p>\n<p>You can set your browser so that you are informed about the setting of cookies and allow cookies only in individual cases, exclude the acceptance of cookies for certain cases or in general, and activate the automatic deletion of cookies when the browser is closed. If cookies are deactivated, the functionality of this website may be limited.</p>\n<p>The use of Hotjar and the storage of Hotjar cookies take place on the basis of Art. 6(1)(f) GDPR. The website operator has a legitimate interest in analysing user behaviour in order to optimise both its website and its advertising. Where a corresponding consent has been requested (for example consent to the storage of cookies), processing takes place exclusively on the basis of Art. 6(1)(a) GDPR; consent can be withdrawn at any time.</p>\n<p><strong>Deactivating Hotjar</strong></p>\n<p>If you wish to deactivate data collection by Hotjar, click on the following link and follow the instructions there: <a href=\"https://www.hotjar.com/opt-out\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.hotjar.com/opt-out</a></p>\n<p>Please note that Hotjar must be deactivated separately for each browser and each device.</p>\n<p>Further information about Hotjar and the data collected can be found in Hotjar&#x27;s privacy policy at the following link: <a href=\"https://www.hotjar.com/privacy\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.hotjar.com/privacy</a></p>\n<h2>6. Newsletter</h2>\n<h3>Newsletter data</h3>\n<p>If you would like to receive the newsletter offered on the website, we require an email address from you as well as information that allows us to verify that you are the owner of the email address provided and that you consent to receiving the newsletter. No further data is collected, or only on a voluntary basis. We use this data exclusively for sending the requested information and do not pass it on to third parties.</p>\n<p>The data entered in the newsletter registration form is processed exclusively on the basis of your consent (Art. 6(1)(a) GDPR). You can withdraw the consent you have given to the storage of the data, the email address and its use for sending the newsletter at any time, for example via the &bdquo;unsubscribe&ldquo; link in the newsletter. The lawfulness of the data processing operations already carried out remains unaffected by the withdrawal.</p>\n<p>The data you deposit with us for the purpose of receiving the newsletter will be stored by us or the newsletter service provider until you unsubscribe from the newsletter and will be deleted from the newsletter distribution list after you cancel the newsletter. Data stored by us for other purposes remains unaffected.</p>\n<p>After you unsubscribe from the newsletter distribution list, your email address may be stored by us or the newsletter service provider on a blacklist in order to prevent future mailings. The data from the blacklist is used only for this purpose and is not merged with other data. This serves both your interest and our interest in complying with the legal requirements when sending newsletters (legitimate interest within the meaning of Art. 6(1)(f) GDPR). Storage on the blacklist is not limited in time. <strong>You may object to the storage if your interests outweigh our legitimate interest.</strong></p>\n<h2>7. Plugins and tools</h2>\n<h3>Google Web Fonts</h3>\n<p>For the uniform display of fonts, this site uses so-called web fonts provided by Google. The Google Fonts are installed locally. No connection to Google servers takes place in this context.</p>\n<p>Further information about Google Web Fonts can be found at <a href=\"https://developers.google.com/fonts/faq\" rel=\"noopener noreferrer\" target=\"_blank\">https://developers.google.com/fonts/faq</a> and in Google&#x27;s privacy policy: <a href=\"https://policies.google.com/privacy?hl=de\" rel=\"noopener noreferrer\" target=\"_blank\">https://policies.google.com/privacy?hl=de</a>.</p>\n<h3>Google Maps</h3>\n<p>This site uses the map service Google Maps via an API. The provider is Google Ireland Limited (&bdquo;Google&ldquo;), Gordon House, Barrow Street, Dublin 4, Ireland.</p>\n<p>In order to use the functions of Google Maps, it is necessary to store your IP address. This information is generally transmitted to a Google server in the USA and stored there. The provider of this site has no influence on this data transfer.</p>\n<p>Google Maps is used in the interest of an appealing presentation of our online offering and so that the places we indicate on the website can be found easily. This constitutes a legitimate interest within the meaning of Art. 6(1)(f) GDPR.</p>\n<p>You can find more information about the handling of user data in Google&#x27;s privacy policy: <a href=\"https://policies.google.com/privacy?hl=de\" rel=\"noopener noreferrer\" target=\"_blank\">https://policies.google.com/privacy?hl=de</a>.</p>\n<h2>8. eCommerce and payment providers</h2>\n<h3>Processing of data (customer and contract data)</h3>\n<p>We collect, process and use personal data only to the extent that it is necessary for the establishment, content or modification of the legal relationship (inventory data). This takes place on the basis of Art. 6(1)(b) GDPR, which permits the processing of data for the performance of a contract or pre-contractual measures. We collect, process and use personal data about the use of this website (usage data) only to the extent that this is necessary to enable the user to use the service or to bill the user for it.</p>\n<p>The customer data collected is deleted after completion of the order or termination of the business relationship. Statutory retention periods remain unaffected.</p>\n<h2>9. Our own services</h2>\n<h3>Handling of applicant data</h3>\n<p>We offer you the opportunity to apply to us (for example by email, by post or via an online application form). Below we inform you about the scope, purpose and use of the personal data collected from you in the course of the application process. We assure you that the collection, processing and use of your data takes place in accordance with applicable data protection law and all other statutory provisions, and that your data is treated in strict confidence.</p>\n<p><strong>Scope and purpose of the data collection </strong></p>\n<p>If you send us an application, we process the associated personal data (for example contact and communication data, application documents, notes taken during interviews and so on) to the extent necessary for the decision on the establishment of an employment relationship. The legal basis for this is Section 26 of the new German Federal Data Protection Act (initiation of an employment relationship), Art. 6(1)(b) GDPR (general contract initiation) and &ndash; where you have given consent &ndash; Art. 6(1)(a) GDPR. Consent can be withdrawn at any time. Within our company, your personal data is passed on only to persons involved in processing your application.</p>\n<p>If the application is successful, the data you have submitted will be stored in our data processing systems on the basis of Section 26 of the new German Federal Data Protection Act and Art. 6(1)(b) GDPR for the purpose of carrying out the employment relationship.</p>\n<p><strong>Retention period of the data</strong></p>\n<p>If we are unable to make you an offer of employment, if you decline an offer of employment or if you withdraw your application, we reserve the right to retain the data you have submitted on the basis of our legitimate interests (Art. 6(1)(f) GDPR) for up to 6 months from the end of the application procedure (rejection or withdrawal of the application). The data is then deleted and the physical application documents are destroyed. Retention serves in particular evidentiary purposes in the event of a legal dispute. If it is apparent that the data will be required after expiry of the 6-month period (for example because of impending or pending legal proceedings), deletion will only take place once the purpose of the further retention no longer applies.</p>\n<p>Longer retention may also take place if you have given corresponding consent (Art. 6(1)(a) GDPR) or if statutory retention obligations preclude deletion.</p>"};
(function(){
  var body=document.getElementById('legalBody');
  var btns=document.querySelectorAll('.langswitch button');
  function apply(l){
    if(!DOC[l]) l = DOC.de ? 'de' : 'en';
    body.innerHTML=DOC[l];
    document.documentElement.lang=l;
    for(var i=0;i<btns.length;i++) btns[i].classList.toggle('active',btns[i].dataset.lang===l);
    try{ localStorage.setItem('hplus_lang',l); }catch(e){}
  }
  for(var i=0;i<btns.length;i++) btns[i].addEventListener('click',function(){ apply(this.dataset.lang); });
  var pref=null;
  try{ pref=localStorage.getItem('hplus_lang'); }catch(e){}
  var path=(location.pathname+location.search+location.hash).toLowerCase();
  if(/(^|[\/\-_?&=])en([\/\-_?&=]|$)/.test(path)) pref='en';
  apply(pref==='en'?'en':'de');
})();
</script>

<script>
/* the header and footer labels follow this page's own language toggle */
(function(){
  var L = {
    de:{nav_checkin:"Check-in",nav_account:"Kontoeinstellungen",foot_privacy:"Datenschutz",foot_terms:"AGB",foot_imprint:"Impressum",foot_contact:"Kontakt",foot_tagline:"Ihr digitaler Begleiter f\u00fcr Ihre Therapie"},
    en:{nav_checkin:"Check-in",nav_account:"Account Settings",foot_privacy:"Privacy Policy",foot_terms:"Terms & Conditions",foot_imprint:"Imprint",foot_contact:"Contact",foot_tagline:"Your digital companion throughout your therapy"}
  };
  function paint(){
    var l=(document.documentElement.lang||'de').toLowerCase().indexOf('en')===0?'en':'de';
    var d=L[l]||L.de;
    document.querySelectorAll('.uhp-header [data-i18n], .uhp-footer [data-i18n]').forEach(function(el){
      var k=el.getAttribute('data-i18n'); if(d[k]!=null) el.textContent=d[k];
    });
  }
  paint();
  try{ new MutationObserver(paint).observe(document.documentElement,{attributes:true,attributeFilter:['lang']}); }catch(e){}
})();
</script>
