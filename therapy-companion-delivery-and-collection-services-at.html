<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
.hplus-legal{--blue:#007EC6;--navy:#06324C;--text:#24272A;--muted:#71777C;--line:#DCE2E6;--wash:#F6F8F9;font-family:'Inter',sans-serif;color:var(--text);background:var(--wash);padding:clamp(24px,5vw,64px) 16px;line-height:1.65}
.hplus-legal *{box-sizing:border-box}
.hplus-legal__card{max-width:880px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:clamp(24px,5vw,52px);box-shadow:0 20px 50px -32px rgba(6,50,76,.45)}
.hplus-legal__eyebrow{color:var(--blue);font-weight:700;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase}
.hplus-legal__note{margin-top:32px;padding:14px 16px;border-radius:12px;background:#E6F3FB;color:#0567A1;font-size:.9rem}
.hplus-legal h1,.hplus-legal h2,.hplus-legal h3{font-family:'Poppins',sans-serif;color:var(--navy)}
.hplus-legal h1{font-size:clamp(1.7rem,4vw,2.6rem);line-height:1.2;margin:10px 0 16px}
.hplus-legal h2{font-size:1.15rem;margin:30px 0 8px}
.hplus-legal h3{font-size:1rem;margin:20px 0 6px}
.hplus-legal p,.hplus-legal li{margin:0 0 12px}
.hplus-legal ul{padding-left:20px}
.hplus-legal table{width:100%;border-collapse:collapse;margin:14px 0;font-size:.88rem}
.hplus-legal th,.hplus-legal td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.hplus-legal th{background:var(--wash)}
.hplus-legal a{color:var(--blue)}
.langswitch{display:flex;gap:6px;justify-content:flex-end;margin-bottom:6px}
.langswitch button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:5px 13px;font:inherit;font-size:.82rem;cursor:pointer}
.langswitch button.active{background:var(--navy);border-color:var(--navy);color:#fff}
@media(max-width:520px){.hplus-legal{padding:12px}.hplus-legal__card{border-radius:16px;padding:22px 18px}}

.uhp-header{padding-bottom:12px;margin-bottom:14px}
.uhp-header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;position:relative;padding:2px 0 16px;margin:0 0 20px}
.uhp-brand{display:inline-flex;align-items:center;gap:12px;text-decoration:none}
.uhp-brand svg{height:34px;width:58px;color:var(--blue);flex:0 0 auto}
.uhp-brand svg.uhp-logo{height:42px;width:auto;display:block;flex:0 0 auto}
.uhp-brand svg.uhp-logo{height:32px}
.uhp-brand .bt{line-height:1.05}
.uhp-brand .bt b{font-family:var(--font-head),'Poppins',sans-serif;font-weight:700;color:var(--ink-head);font-size:17px;letter-spacing:.01em;display:block}
.uhp-brand .bt small{display:block;font-family:var(--font-body);font-weight:600;color:var(--blue-2);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
.uhp-brand svg{height:28px;width:48px}
.uhp-brand .bt b{font-size:15px}
.uhp-header-right{display:flex;align-items:center;gap:12px}
.acct-btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--blue),var(--blue-3));color:#fff !important;font-family:var(--font-head),inherit;font-size:clamp(11px,.95vw,13.5px);font-weight:600;letter-spacing:.4px;line-height:1;text-transform:uppercase;text-decoration:none !important;padding:13px 20px;border-radius:999px;white-space:nowrap;box-shadow:0 12px 24px -12px rgba(0,126,198,.75);transition:opacity .2s ease,transform .2s ease,box-shadow .2s ease}
.acct-btn{font-size:12px;padding:11px 16px}
.acct-btn:hover{transform:translateY(-1px);box-shadow:0 16px 30px -12px rgba(0,126,198,.8)}
.uhp-avatar{width:42px;height:42px;display:block;object-fit:contain;border-radius:50%;box-shadow:0 4px 12px -6px rgba(6,50,76,.5)}
.uhp-avatar{width:36px;height:36px}
.uhp-footer{margin-top:26px;border-radius:22px;overflow:hidden;position:relative;background:linear-gradient(120deg,#06324C 0%,#064B73 48%,#007EC6 100%);color:#fff;padding:26px 30px;box-shadow:0 18px 44px -24px rgba(6,50,76,.55)}
.uhp-footer{padding:22px 20px;text-align:center}
.uhp-footer-top{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:14px 24px;flex-wrap:wrap}
.uhp-footer-top{justify-content:center}
.uhp-footer-brand svg.uhp-logo{height:34px;width:auto;display:block}
.uhp-footer-brand svg.uhp-logo .hl-word{fill:#fff}
.uhp-footer-brand{display:flex;align-items:center;gap:12px}
.uhp-footer-brand svg{height:30px;width:52px;color:#fff}
.uhp-footer-brand span{font-family:var(--font-head),'Poppins',sans-serif;font-weight:600;font-size:15px}
.uhp-footer-links{display:flex;gap:18px;flex-wrap:wrap}
.uhp-footer-links a{color:#D5E7F2;text-decoration:none;font-family:var(--font-body);font-size:13.5px;font-weight:500;transition:color .15s}
.uhp-footer-links a:hover{color:#fff}
.uhp-footer-links{justify-content:center}
.uhp-footer-bottom{position:relative;z-index:1;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.18);font-family:var(--font-body);font-size:12px;color:#BCDFF5}
.bt{line-height:1.05}
.bt b{font-family:var(--font-head),'Poppins',sans-serif;font-weight:700;color:var(--ink-head);font-size:17px;letter-spacing:.01em;display:block}
.bt small{display:block;font-family:var(--font-body);font-weight:600;color:var(--blue-2);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
.bt b{font-size:15px}

/* variables and layout for the shared header and footer */
:root{
  --blue:#007EC6;--blue-2:#0567A1;--blue-3:#064B73;--ink-head:#06324C;--blue-050:#E6F3FB;
  --ink:#24272A;--muted:#71777C;--hair:#DCE2E6;--grey:#9D9D9C;
  --teal:#0FB5A5;--coral:#FF6A5A;--gold:#F5B83D;--ok:#1EA672;--error:#FF6A5A;
  --page:#F6F8F9;--card:#FFFFFF;
  --font-head:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --radius-card:22px;--radius-btn:999px;
}
.hplus-wrap{max-width:820px;margin:0 auto}
.hplus-wrap{max-width:100%}
.hplus-root{padding:16px 16px 0;font-family:var(--font-body)}

/* align the shared header and footer with the document card */
.hplus-root > .hplus-wrap{max-width:880px;margin:0 auto}
/* header: brand on the left, language pill and the two buttons on the right */
.uhp-header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:12px;margin-bottom:14px}
.uhp-header-right{display:flex;align-items:center;gap:12px;margin-left:auto}
.uhp-header .langswitch{margin:0;justify-content:flex-end}
.uhp-header .langswitch .seg,.uhp-header .langswitch{border-radius:999px}
.uhp-header .langswitch button{padding:7px 15px;font-size:12.5px}
@media(max-width:767px){
  .uhp-header{gap:10px}
  .uhp-header-right{gap:8px;width:100%;justify-content:flex-end}
}

/* language pill in the header */
.uhp-header .langswitch{display:flex;justify-content:flex-end;margin:0;position:relative;z-index:40}
.uhp-header .langswitch .seg{display:inline-flex;background:#fff;border:1px solid var(--hair);border-radius:999px;overflow:hidden;box-shadow:0 6px 16px -12px rgba(6,50,76,.35)}
.uhp-header .langswitch button{font-family:var(--font-head),inherit;font-size:12.5px;font-weight:600;border:none;background:transparent;color:var(--muted);padding:7px 15px;cursor:pointer;transition:.15s;letter-spacing:.03em;line-height:1.4}
.uhp-header .langswitch button.active{background:var(--blue);color:#fff}

/* ---- Site-style header: full-bleed white bar, content aligned to the page ---- */
.hplus-root{ overflow-x:clip; }
.uhp-header{
  position:relative;
  box-sizing:border-box !important;   /* the legal pages have no global border-box reset */
  width:100vw !important;
  max-width:100vw !important;
  margin-left:calc(50% - 50vw) !important;
  margin-right:calc(50% - 50vw) !important;
  background:#ffffff !important;
  border-bottom:1px solid #E6ECF0;
  padding:14px max(20px, calc(50vw - 600px)) !important;
  margin-bottom:22px !important;
}
.uhp-header::after{ display:none !important; }          /* the teal underline belonged to the boxed header */
.uhp-header-right{ margin-left:auto !important; }
/* the header is full-bleed now, so nothing should sit above it */
.hplus-root{ padding-top:0 !important; }
/* the language selector belongs at the far right of the header */
.uhp-header .langswitch{ order:99 !important; margin-left:4px !important; }
/* Language pill, matching the one in the site header: blue track, white active segment */
.uhp-header .langswitch .seg{
  background:var(--blue) !important;
  border:1px solid var(--blue) !important;
  padding:3px !important;
  box-shadow:none !important;
}
.uhp-header .langswitch button{
  color:#ffffff !important;
  background:transparent !important;
  border-radius:999px !important;
  padding:6px 16px !important;
}
.uhp-header .langswitch button.active{
  background:#ffffff !important;
  color:var(--blue) !important;
}
@media(max-width:640px){
  .uhp-header{ padding:12px 16px !important; }
  /* three controls do not fit one phone row - let them wrap instead of spilling off-screen */
  .uhp-header-right{ width:100%; justify-content:flex-end; flex-wrap:wrap; gap:8px !important; }
  .uhp-header .langswitch{ flex:0 0 auto; }
  .uhp-header .langswitch button{ padding:6px 13px !important; font-size:12px !important; }
  .uhp-header-right > a{ font-size:12px !important; padding:9px 14px !important; }
}
</style>

var DOC = {"de": "<h1>Abhol- und Lieferservice &#x2013; Bedingungen (&#xD6;sterreich)</h1>\n<h2>1 &#xB7; Rechtlicher Rahmen &amp; Compliance-Hinweise (&#xD6;sterreich)</h2>\n<p>Diese Punkte bestimmen die rechtssichere Ausgestaltung und sind in die nachstehenden Mustertexte und Flows bereits eingearbeitet.</p>\n<h3>Versandhandelsverbot &amp; Abholmodell</h3>\n<p>Der Versandhandel mit rezeptpflichtigen Arzneimitteln ist in &#xD6;sterreich verboten (&#xA7; 59 Abs. 8 AMG); e-Rezepte k&#xF6;nnen nur in einer Apotheke vor Ort eingel&#xF6;st werden. Eine Zustellung durch die Apotheke scheidet daher aus. Zul&#xE4;ssig und gelebte Praxis ist die Abholung durch eine bevollm&#xE4;chtigte Person: Die/der Patient:in beauftragt den Pflegedienst als Boten, das Medikament in der gew&#xE4;hlten Apotheke abzuholen und zu &#xFC;berbringen. Die Abgabe erfolgt in der Apotheke &#x2013; es liegt kein Versandhandel vor.</p>\n<h3>Einl&#xF6;sung/Abholung durch den Boten &#x2013; zul&#xE4;ssige Wege</h3>\n<p>Damit der Pflegedienst das e-Rezept abholen darf, erm&#xE4;chtigt die/der Patient:in ihn auf einem dieser Wege: SV-Einl&#xF6;sevollmacht (&#xFC;ber ID Austria; erlaubt nur das Sehen offener e-Rezepte und das Abholen der Heilmittel, keine weiteren Gesundheitsdaten), e-Berechtigung (mit Sozialversicherungsnummer), Weitergabe von e-Rezept-Code/-ID bzw. Ausdruck f&#xFC;r die konkrete Abholung oder &#xDC;bergabe der e-card f&#xFC;r die konkrete Abholung. Ein e-Rezept kann in jeder Apotheke abgeholt werden.</p>\n<h3>Freie Apothekenwahl &amp; keine Zuweisung gegen Vorteil</h3>\n<p>Die/der Patient:in w&#xE4;hlt die Apotheke frei und kann jederzeit wechseln; eine etwaige Partnerapotheke ist nur ein unverbindlicher Vorschlag. Der Pflegedienst darf f&#xFC;r die Lenkung der Abholung zu einer bestimmten Apotheke keinen Vorteil/keine Verg&#xFC;tung von der Apotheke erhalten. Eine etwaige Kooperation mit einer Partnerapotheke ist vorab anwaltlich (Apotheken-/Berufs-/Wettbewerbsrecht) zu pr&#xFC;fen.</p>\n<h3>Gesundheitsdaten &amp; Datenschutz (DSGVO/DSG)</h3>\n<p>Versicherten-, Verordnungs- und Medikationsdaten sind besondere Kategorien (Art. 9 DSGVO). Erforderlich ist eine ausdr&#xFC;ckliche Einwilligung (Art. 6 Abs. 1 lit. a i. V. m. Art. 9 Abs. 2 lit. a DSGVO), die freiwillig, getrennt, informiert, widerruflich und nachweisbar ist (Art. 7 DSGVO). Aufsicht: &#xF6;sterreichische Datenschutzbeh&#xF6;rde. Datenminimierung: Der Bote ben&#xF6;tigt nur das einzelne e-Rezept &#x2013; keine Einsicht in die gesamte e-Medikationsliste (diese erfordert das Stecken der e-card in der Apotheke).</p>\n<h3>&#xC4;rztliche Verschwiegenheit &amp; WhatsApp</h3>\n<p>F&#xFC;r den Arztkontakt wird die/der behandelnde Arzt/&#xC4;rztin gegen&#xFC;ber dem Pflegedienst zweckgebunden von der &#xE4;rztlichen Verschwiegenheitspflicht (&#xA7; 54 &#xC4;rzteG 1998) entbunden. &#xDC;ber WhatsApp d&#xFC;rfen keine Gesundheitsdaten und insbesondere keine e-Rezept-Codes/-IDs &#xFC;bertragen werden (Zugang zur Verordnung). WhatsApp dient nur der Ansprache und der &#xDC;bergabe des Einwilligungs-Links; die Erm&#xE4;chtigung zur Abholung erfolgt &#xFC;ber SV-Einl&#xF6;sevollmacht/e-Berechtigung bzw. pers&#xF6;nlich.</p>\n<h2>2.1 Einwilligung A &#x2013; Kontaktaufnahme mit der Ordination zur Anforderung von Folgeverordnungen</h2>\n<p>Ich beauftrage und erm&#xE4;chtige United Healthcare Austria (nachfolgend &#x201E;der Pflegedienst&#x201C;), f&#xFC;r mich bei meiner/meinem behandelnden &#xC4;rztin/Arzt Folge- bzw. Dauerverordnungen (e-Rezept) f&#xFC;r meine Dauermedikation anzufordern und die Ausstellung zu veranlassen.</p>\n<p>Zu diesem Zweck willige ich ein, dass der Pflegedienst die erforderlichen Daten verarbeitet und an die Ordination &#xFC;bermittelt, insbesondere: Vor- und Nachname, Geburtsdatum, Anschrift, Sozialversicherungsnummer, Angaben zur ben&#xF6;tigten Medikation sowie die Kontaktdaten der Ordination.</p>\n<p>Soweit erforderlich, entbinde ich die genannte &#xC4;rztin/den genannten Arzt gegen&#xFC;ber dem Pflegedienst von der &#xE4;rztlichen Verschwiegenheitspflicht (&#xA7; 54 &#xC4;rzteG 1998), beschr&#xE4;nkt auf den Zweck der Anforderung und Abwicklung von Folgeverordnungen.</p>\n<p>Diese Einwilligung ist freiwillig und jederzeit mit Wirkung f&#xFC;r die Zukunft widerruflich, ohne dass mir Nachteile entstehen; meine pflegerische Versorgung bleibt unber&#xFC;hrt. Die Rechtm&#xE4;&#xDF;igkeit der bis zum Widerruf erfolgten Verarbeitung bleibt unber&#xFC;hrt.</p>\n<p>Rechtsgrundlage: Art. 6 Abs. 1 lit. a i. V. m. Art. 9 Abs. 2 lit. a DSGVO.</p>\n<h2>2.2 Einwilligung B &#x2013; Beauftragung mit Abholung &amp; &#xDC;berbringung der Medikamente (Botendienst)</h2>\n<p>In &#xD6;sterreich ist der Versand rezeptpflichtiger Arzneimittel verboten (&#xA7; 59 Abs. 8 AMG). Damit ich meine Medikamente dennoch bequem erhalte, beauftrage und bevollm&#xE4;chtige ich den Pflegedienst, meine Medikamente in der von mir gew&#xE4;hlten Apotheke vor Ort abzuholen und mir zu &#xFC;berbringen. Es handelt sich um eine Abholung durch eine von mir bevollm&#xE4;chtigte Person (Botendienst) &#x2013; nicht um einen Versand durch die Apotheke; die Abgabe erfolgt wie &#xFC;blich in der Apotheke.</p>\n<h3>Freie Apothekenwahl</h3>\n<p>Ich bestimme, in welcher Apotheke abgeholt wird, und kann jede Apotheke frei w&#xE4;hlen und jederzeit wechseln. Eine etwaige Partnerapotheke ist nur ein unverbindlicher Vorschlag.</p>\n<p>Gew&#xE4;hlte Apotheke:</p>\n<p>Partnerapotheke:Apotheke an der Bergstra&#xDF;e</p>\n<p>Bergstra&#xDF;e 31, 69469 Weinheim, Deutschland</p>\n<p>International Specialty Pharmacy (ISP)</p>\n<p>Paul-Henri Spaaklaan 3B, 6229 EN Maastricht, Niederlande</p>\n<p>Ich erm&#xE4;chtige den Pflegedienst, das e-Rezept auf jedem der nachstehend genannten Wege abzuholen:</p>\n<ul><li>SV-Einl&#xF6;sevollmacht &#xFC;ber ID Austria (empfohlen)</li><li>e-Berechtigung (mit Sozialversicherungsnummer)</li><li>Weitergabe von e-Rezept-Code/-ID bzw. Ausdruck f&#xFC;r die konkrete Abholung</li><li>&#xDC;bergabe der e-card f&#xFC;r die konkrete Abholung</li></ul>\n<p>Ich willige ein, dass der Pflegedienst die zur Abholung erforderlichen Daten verarbeitet (Name, Sozialversicherungsnummer, Angaben zum abzuholenden Heilmittel, gew&#xE4;hlte Apotheke). Eine dar&#xFC;ber hinausgehende Einsicht in meine e-Medikationsliste ist damit nicht verbunden.</p>\n<p>Kosten: Rezeptgeb&#xFC;hr und etwaige Selbstbehalte trage ich; sie werden in meinem Auftrag entrichtet und mit mir abgerechnet.</p>\n<p>Transparenzhinweis: Der Pflegedienst erh&#xE4;lt von der Apotheke f&#xFC;r die Abholung/&#xDC;berbringung keine Verg&#xFC;tung und keine sonstigen Vorteile. Die Abholung erfolgt ausschlie&#xDF;lich auf meinen Wunsch und meine Weisung.</p>\n<p>Diese Einwilligung/Vollmacht ist freiwillig und jederzeit mit Wirkung f&#xFC;r die Zukunft widerruflich; Nachteile entstehen nicht.</p>\n<p>Rechtsgrundlage: Art. 6 Abs. 1 lit. a i. V. m. Art. 9 Abs. 2 lit. a DSGVO.</p>", "en": "<h1>Pick Up and Delivery Service Terms (Austria)</h1>\n<h2>1 &#xB7; Legal framework &amp; compliance notes (Austria)</h2>\n<p>These points determine the legally compliant structure of the service and have already been incorporated into the sample texts and flows below.</p>\n<h3>Mail-order ban &amp; collection model</h3>\n<p>Mail-order sale of prescription-only medicines is prohibited in Austria (&#xA7; 59 (8) AMG); e-prescriptions can only be redeemed at a local pharmacy. Delivery by the pharmacy is therefore ruled out. What is permissible &#x2013; and established practice &#x2013; is collection by an authorized person: the patient commissions the care service as a courier to collect the medicine at the chosen pharmacy and deliver it. Dispensing takes place at the pharmacy &#x2013; there is no mail-order sale.</p>\n<h3>Redemption/collection by the courier &#x2013; permissible routes</h3>\n<p>For the care service to be allowed to collect against the e-prescription, the patient authorizes it via one of the following routes: SV redemption authorization (&#x201C;SV-Einl&#xF6;sevollmacht&#x201D;) (via ID Austria; permits only viewing open e-prescriptions and collecting the medicines, no other health data), e-authorization (&#x201C;e-Berechtigung&#x201D;) (with the social insurance number), handover of the e-prescription code/ID or printout for the specific collection, or handover of the e-card for the specific collection. An e-prescription can be collected at any pharmacy.</p>\n<h3>Free choice of pharmacy &amp; no steering in exchange for an advantage</h3>\n<p>The patient chooses the pharmacy freely and can switch at any time; any partner pharmacy is only a non-binding suggestion. The care service may not receive any advantage/remuneration from the pharmacy for steering collections toward a particular pharmacy. Any cooperation with a partner pharmacy must be reviewed by legal counsel in advance (pharmacy/professional/competition law).</p>\n<h3>Health data &amp; data protection (GDPR/DSG)</h3>\n<p>Insurance, prescription, and medication data are special categories of personal data (Art. 9 GDPR). What is required is express consent (Art. 6 (1)(a) in conjunction with Art. 9 (2)(a) GDPR) that is voluntary, separate, informed, revocable, and verifiable (Art. 7 GDPR). Supervisory authority: the Austrian Data Protection Authority. Data minimization: the courier needs only the individual e-prescription &#x2013; no access to the entire e-medication list (viewing that list would require inserting the e-card at the pharmacy).</p>\n<h3>Medical confidentiality &amp; WhatsApp</h3>\n<p>For the doctor contact, the treating physician is released from the duty of medical confidentiality (&#xA7; 54 &#xC4;rzteG 1998 [Austrian Physicians Act]) vis-&#xE0;-vis the care service, limited to that specific purpose. No health data &#x2013; and in particular no e-prescription codes/IDs &#x2013; may be transmitted via WhatsApp (they provide access to the prescription). WhatsApp serves only for the initial approach and for handing over the consent link; the authorization for collection is set up via the SV redemption authorization/e-authorization or in person.</p>\n<h2>2 &#xB7; Consent and information texts (the &#x201C;texts behind the link&#x201D;)</h2>\n<p>Binding content that both the WhatsApp message and the online journey refer to. It can be placed unchanged on the linked consent page.</p>\n<h2>2.1 Consent A &#x2013; Contacting the doctor&#x2019;s practice to request follow-up prescriptions</h2>\n<p>I commission and authorize United Healthcare Austria (hereinafter &#x201C;the care service&#x201D;) to request, on my behalf, follow-up or long-term prescriptions (e-prescription) for my long-term medication from my treating physician and to arrange for their issuance.</p>\n<p>For this purpose, I consent to the care service processing the required data and transmitting it to the doctor&#x2019;s practice, in particular: first and last name, date of birth, address, social insurance number, details of the required medication, and the contact details of the practice.</p>\n<p>To the extent necessary, I release the named physician from the duty of medical confidentiality (&#xA7; 54 &#xC4;rzteG 1998) vis-&#xE0;-vis the care service, limited to the purpose of requesting and processing follow-up prescriptions.</p>\n<p>This consent is voluntary and may be revoked at any time with effect for the future, without any disadvantage to me; my nursing care remains unaffected. The lawfulness of processing carried out up to the point of revocation remains unaffected.</p>\n<p>Legal basis: Art. 6 (1)(a) in conjunction with Art. 9 (2)(a) GDPR.</p>\n<h2>2.2 Consent B &#x2013; Commissioning the collection &amp; delivery of medications (courier service)</h2>\n<p>In Austria, shipping prescription-only medicines is prohibited (&#xA7; 59 (8) AMG). So that I can nevertheless receive my medications conveniently, I commission and authorize the care service to collect my medications at the local pharmacy chosen by me and deliver them to me. This is a collection by a person authorized by me (courier service) &#x2013; not shipping by the pharmacy; dispensing takes place, as usual, at the pharmacy.You have the right to choose your pharmacy freely. The partner pharmacy named below is merely a non-binding offer. You are not obliged to use it and may name a different pharmacy or switch pharmacies at any time &#x2013; without any disadvantage.</p>\n<h3>Free choice of pharmacy</h3>\n<p>I determine at which pharmacy collection takes place, and I may freely choose any pharmacy and switch at any time. Any partner pharmacy is only a non-binding suggestion.</p>\n<p>Chosen pharmacy:</p>\n<p>Partner pharmacy:</p>\n<p>Apotheke an der Bergstra&#xDF;e</p>\n<p>Bergstra&#xDF;e 31, 69469 Weinheim, Germany</p>\n<p>International Specialty Pharmacy (ISP)</p>\n<p>Paul-Henri Spaaklaan 3B, 6229 EN Maastricht, Netherlands</p>\n<p>Authorization to collect against the e-prescription (any of the following routes):</p>\n<ul><li>SV redemption authorization via ID Austria (recommended)</li><li>e-authorization (with social insurance number)</li><li>Handover of the e-prescription code/ID or printout for the specific collection</li><li>Handover of the e-card for the specific collection</li></ul>\n<p>I consent to the care service processing the data required for the collection (name, social insurance number, details of the medicine to be collected, chosen pharmacy). This does not include any further access to my e-medication list.</p>\n<p>Costs: I bear the prescription fee and any co-payments; they are paid on my behalf and settled with me.</p>\n<p>Transparency notice: The care service receives no remuneration and no other advantages from the pharmacy for the collection/delivery. Collection takes place exclusively at my request and on my instruction.</p>\n<p>This consent/authorization is voluntary and may be revoked at any time with effect for the future; no disadvantages arise.</p>\n<p>Legal basis: Art. 6 (1)(a) in conjunction with Art. 9 (2)(a) GDPR.</p>"};
(function(){
  var body=document.getElementById('legalBody');
  var btns=document.querySelectorAll('.langswitch button');
  function apply(l){
    if(!DOC[l]) l = DOC.de ? 'de' : 'en';
    body.innerHTML=DOC[l];
    document.documentElement.lang=l;
    for(var i=0;i<btns.length;i++) btns[i].classList.toggle('active',btns[i].dataset.lang===l);
    try{ localStorage.setItem('hplus_lang',l); }catch(e){}
  }
  for(var i=0;i<btns.length;i++) btns[i].addEventListener('click',function(){ apply(this.dataset.lang); });
  var pref=null;
  try{ pref=localStorage.getItem('hplus_lang'); }catch(e){}
  var path=(location.pathname+location.search+location.hash).toLowerCase();
  if(/(^|[\/\-_?&=])en([\/\-_?&=]|$)/.test(path)) pref='en';
  apply(pref==='en'?'en':'de');
})();
</script>

<script>
/* the header and footer labels follow this page's own language toggle */
(function(){
  var L = {
    de:{nav_checkin:"Check-in",nav_account:"Kontoeinstellungen",foot_privacy:"Datenschutz",foot_terms:"AGB",foot_imprint:"Impressum",foot_contact:"Kontakt",foot_tagline:"Ihr digitaler Begleiter f\u00fcr Ihre Therapie"},
    en:{nav_checkin:"Check-in",nav_account:"Account Settings",foot_privacy:"Privacy Policy",foot_terms:"Terms & Conditions",foot_imprint:"Imprint",foot_contact:"Contact",foot_tagline:"Your digital companion throughout your therapy"}
  };
  function paint(){
    var l=(document.documentElement.lang||'de').toLowerCase().indexOf('en')===0?'en':'de';
    var d=L[l]||L.de;
    document.querySelectorAll('.uhp-header [data-i18n], .uhp-footer [data-i18n]').forEach(function(el){
      var k=el.getAttribute('data-i18n'); if(d[k]!=null) el.textContent=d[k];
    });
  }
  paint();
  try{ new MutationObserver(paint).observe(document.documentElement,{attributes:true,attributeFilter:['lang']}); }catch(e){}
})();
</script>
